  ═══════════════════════════════════════════════════════════════

  Three boards, one per step of the nuri-expo send journey
  (docs/research/wireframes/send-lightning-contact.md · S1 → S2 → S3).
  Pure DS composition (decision 57 · the playground is the "composes"
  step made visible): DS elements + their attributes only, no page CSS,
  no inline styles, nothing the RN twin could not express 1:1. Every
  slightly-off composition is listed in the MISFIT LOG at the end of the
  page — that log is the deliverable; the boards are how it is read.

  Flow-page skeleton, header, keypad and footer copied verbatim from

       air between copy and buttons, Footer inside the panel for the safe-area bottom
       padding. Changes for the send flow: no "Scan" button (a live camera reads a QR,
       and a printed IBAN as Vivid does); copy names what it reads. Close over the
       camera, top right. The camera column and the panel are stacked so the viewfinder
       centres in the visible height; the panel's rounded corners reveal the dark
       column behind it. Status bar: not driven by the DS (docs/status-bar-declaration-
       note.md); in RN a <StatusBar style="light"/> inside this screen. -->
