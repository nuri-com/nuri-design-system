<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Move</title>
  <link rel="stylesheet" href="../generated/playground.css" />
  <script src="../generated/boot.js" type="module"></script>
</head>
<body>

<nuri-playground-shell doc="Move">

  <!-- MOVE · a full-modal conversion board built only from the current DS
       vocabulary. Each currency cluster is one real disclosure target. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="move">
    <template>
      <nuri-screen>
        <nuri-view chrome="canvas" fill></nuri-view>

        <nuri-modal open mode="full">
          <nuri-modal-panel>
            <nuri-header safe-area-top chrome="transparent" safe-area-chrome="canvas">
              <nuri-topbar surface="transparent" layout="fluid">
                <nuri-topbar-title>Move</nuri-topbar-title>
                <nuri-topbar-trailing>
                  <nuri-icon-button icon="cross" variant="soft" aria-label="Close"></nuri-icon-button>
                </nuri-topbar-trailing>
              </nuri-topbar>
            </nuri-header>

            <nuri-scroll safe-area-bottom>
              <nuri-view direction="column" align="stretch" gap="xl" padding-x="lg" padding-bottom="lg" fill>
                <nuri-scope mode="dark">
                  <nuri-view chrome="subtle" radius="lg" padding-x="lg" padding-top="sm" padding-bottom="lg" fill="grow">
                    <nuri-view direction="column" gap="md" fill="grow">
                      <nuri-view direction="row" justify="between" align="center">
                        <nuri-select-trigger aria-label="From" accessibility-value="Bitcoin">
                          <nuri-select-trigger-label>From</nuri-select-trigger-label>
                          <nuri-select-trigger-avatar name="bitcoin" variant="solid" accent="orange"></nuri-select-trigger-avatar>
                          <nuri-select-trigger-value>Bitcoin</nuri-select-trigger-value>
                          <nuri-select-trigger-chevron name="caret-down"></nuri-select-trigger-chevron>
                        </nuri-select-trigger>
                        <nuri-typography size="md" emphasis>₿ 86969</nuri-typography>
                      </nuri-view>

                      <nuri-view direction="row" align="center" height="lg">
                        <nuri-view fill="grow">
                          <nuri-separator y-space="none"></nuri-separator>
                        </nuri-view>
                        <nuri-icon-button
                          variant="solid"
                          icon="transfer-vertical"
                          aria-label="Swap Bitcoin and Euro"
                        ></nuri-icon-button>
                        <nuri-view fill="grow">
                          <nuri-separator y-space="none"></nuri-separator>
                        </nuri-view>
                      </nuri-view>

                      <nuri-select-trigger aria-label="To" accessibility-value="Euro">
                        <nuri-select-trigger-label>To</nuri-select-trigger-label>
                        <nuri-select-trigger-avatar source="../assets/flags/eur.svg"></nuri-select-trigger-avatar>
                        <nuri-select-trigger-value>Euro</nuri-select-trigger-value>
                        <nuri-select-trigger-chevron name="caret-down"></nuri-select-trigger-chevron>
                      </nuri-select-trigger>

                      <nuri-view fill="grow" justify="end" align="end">
                        <nuri-typography size="3xl" align="end">€ 48.18</nuri-typography>
                      </nuri-view>
                    </nuri-view>
                  </nuri-view>
                </nuri-scope>

                <nuri-view direction="column" gap="sm">
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>1</nuri-button>
                    <nuri-button>2</nuri-button>
                    <nuri-button>3</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>4</nuri-button>
                    <nuri-button>5</nuri-button>
                    <nuri-button>6</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>7</nuri-button>
                    <nuri-button>8</nuri-button>
                    <nuri-button>9</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>.</nuri-button>
                    <nuri-button>0</nuri-button>
                    <nuri-button aria-label="Delete"><nuri-button-icon name="chevron-left"></nuri-button-icon></nuri-button>
                  </nuri-view>
                </nuri-view>

                <nuri-button size="lg" variant="solid" accent="lilac">Next</nuri-button>
              </nuri-view>
            </nuri-scroll>
          </nuri-modal-panel>
        </nuri-modal>
      </nuri-screen>
    </template>
  </nuri-demo>

    <template>

        <nuri-view chrome="canvas" fill></nuri-view>

        <nuri-modal open mode="full">
          <nuri-modal-panel>

                    <nuri-view chrome="subtle" radius="lg" padding-x="lg" padding-y="sm">

                        <nuri-typography size="md" emphasis>₿ 86969</nuri-typography>
                      </nuri-view>
                    </nuri-view>

                    <!-- The 60px seam lane contains the complete 48px swap target.
                         Its 6px caps plus each card's 6px trigger inset produce

  <!-- TRIGGER CANDIDATES · current SelectField chrome beside both real
       SelectTrigger variants. No candidate-only styling or invented attributes. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="trigger candidates">
    <template>
      <nuri-screen>
        <nuri-view chrome="canvas" direction="column" align="stretch" justify="center" gap="lg" padding="lg" fill>
          <!-- 1 · the current non-inline answer: the country selector as shipped
               in the country picker. -->
          <nuri-select-field aria-label="Country" accessibility-value="Germany">
            <nuri-select-field-label>Country</nuri-select-field-label>
            <nuri-select-field-avatar source="../assets/flags/deu.svg"></nuri-select-field-avatar>
            <nuri-select-field-value>Germany</nuri-select-field-value>
            <nuri-select-field-chevron name="caret-down"></nuri-select-field-chevron>
          </nuri-select-field>

          <!-- 2 · inline ghost cluster: bare in this stretching column. -->
          <nuri-select-trigger aria-label="From" accessibility-value="Bitcoin">
            <nuri-select-trigger-label>From</nuri-select-trigger-label>
            <nuri-select-trigger-avatar name="bitcoin" variant="solid" accent="orange"></nuri-select-trigger-avatar>
            <nuri-select-trigger-value>Bitcoin</nuri-select-trigger-value>
            <nuri-select-trigger-chevron name="caret-down"></nuri-select-trigger-chevron>
          </nuri-select-trigger>

          <!-- 3 · inline subtle: bare in the same stretching column. -->
          <nuri-select-trigger variant="subtle" aria-label="From" accessibility-value="Bitcoin">
            <nuri-select-trigger-label>From</nuri-select-trigger-label>
            <nuri-select-trigger-avatar name="bitcoin" variant="solid" accent="orange"></nuri-select-trigger-avatar>
