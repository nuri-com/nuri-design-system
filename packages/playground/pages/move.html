<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Move</title>
  <link rel="stylesheet" href="../generated/playground.css" />
  <script src="../generated/boot.js" type="module"></script>
</head>
<body>

<nuri-playground-shell doc="Move">

  <!-- MOVE · the canonical board (D1, 2026-08-15): no-topbar chrome, the
       conversion split into an intrinsic From card and a growing To card, the
       swap disc riding the seam between them via Bleed. The two earlier
       exploration boards are pruned (git history keeps them). -->
  <nuri-demo layout="board" controls="device,theme,accent" label="move">
    <template>
      <nuri-screen>
        <nuri-view chrome="canvas" fill></nuri-view>

        <nuri-modal open mode="full">
          <nuri-modal-panel>
            <nuri-scroll safe-area-top safe-area-bottom>
              <nuri-view direction="column" align="stretch" gap="xl" padding-x="lg" padding-y="lg" fill>
                <!-- The seam, via Bleed (#212): one dark scope wraps both cards
                     AND the swap row (solid resolves light, per the mock). The
                     zero-flow-height Bleed row rides the card boundary; the
                     parent gap fires twice around it, so the seam = 2 × gap =
                     6px with gap="xs" (space retune 2026-08-15: xs 4→3, 2xs
                     retired — supersedes the admission's 2xs arithmetic). -->
                <nuri-scope mode="dark">
                  <nuri-view direction="column" align="stretch" gap="xs" fill="grow">
                    <nuri-view chrome="subtle" radius="lg" padding-x="lg" height="xl" justify="center">
                      <nuri-view direction="row" justify="between" align="center">
                        <nuri-select-trigger aria-label="From" accessibility-value="Bitcoin">
                          <nuri-select-trigger-label>From</nuri-select-trigger-label>
                          <nuri-select-trigger-avatar name="bitcoin" variant="solid" accent="orange"></nuri-select-trigger-avatar>
                          <nuri-select-trigger-value>Bitcoin</nuri-select-trigger-value>
                          <nuri-select-trigger-chevron name="caret-down"></nuri-select-trigger-chevron>
                        </nuri-select-trigger>
                        <nuri-typography size="md" emphasis>₿ 86969</nuri-typography>
                      </nuri-view>
                    </nuri-view>

                    <nuri-bleed top="xl" bottom="xl">
                      <nuri-view direction="row" justify="center" align="center" height="lg">
                        <nuri-icon-button
                          variant="solid"
                          icon="arrow-down"
                          aria-label="Swap Bitcoin and Euro"
                        ></nuri-icon-button>
                      </nuri-view>
                    </nuri-bleed>

                    <nuri-view chrome="subtle" radius="lg" padding-x="lg" padding-y="md" fill="grow">
                      <nuri-select-trigger aria-label="To" accessibility-value="Euro">
                        <nuri-select-trigger-label>To</nuri-select-trigger-label>
                        <nuri-select-trigger-avatar source="../assets/flags/eur.svg"></nuri-select-trigger-avatar>
                        <nuri-select-trigger-value>Euro</nuri-select-trigger-value>
                        <nuri-select-trigger-chevron name="caret-down"></nuri-select-trigger-chevron>
                      </nuri-select-trigger>

                      <nuri-view fill="grow" justify="end" align="end">
                        <nuri-typography size="3xl" align="end">€ 48.18</nuri-typography>
                      </nuri-view>
                    </nuri-view>
                  </nuri-view>
                </nuri-scope>

                <nuri-view direction="column" gap="sm">
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>1</nuri-button>
                    <nuri-button>2</nuri-button>
                    <nuri-button>3</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>4</nuri-button>
                    <nuri-button>5</nuri-button>
                    <nuri-button>6</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>7</nuri-button>
                    <nuri-button>8</nuri-button>
                    <nuri-button>9</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>.</nuri-button>
                    <nuri-button>0</nuri-button>
                    <nuri-button aria-label="Delete"><nuri-button-icon name="chevron-left"></nuri-button-icon></nuri-button>
                  </nuri-view>
                </nuri-view>

                <nuri-view direction="row" distribute="even" gap="sm">
                  <nuri-button size="lg" variant="soft">Cancel</nuri-button>
                  <nuri-button size="lg" variant="solid" accent="lilac">Next</nuri-button>
                </nuri-view>
              </nuri-view>
            </nuri-scroll>
          </nuri-modal-panel>
        </nuri-modal>
      </nuri-screen>
    </template>
  </nuri-demo>

  <!-- MOVE · INVERTED · the same composition with the card weights swapped:
       the FROM card grows and carries the typed Bitcoin amount large at its
       bottom-right; the To card is the intrinsic strip with the converted euro
       amount small on the trigger row. Same Bleed seam, same tokens — only the
       fill/padding roles and the amount placements move between the cards. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="move · inverted">
    <template>
      <nuri-screen>
        <nuri-view chrome="canvas" fill></nuri-view>

        <nuri-modal open mode="full">
          <nuri-modal-panel>
            <nuri-scroll safe-area-top safe-area-bottom>
              <nuri-view direction="column" align="stretch" gap="xl" padding-x="lg" padding-y="lg" fill>
                <nuri-scope mode="dark">
                  <nuri-view direction="column" align="stretch" gap="xs" fill="grow">
                    <nuri-view chrome="subtle" radius="lg" padding-x="lg" padding-y="md" fill="grow">
                      <nuri-select-trigger aria-label="From" accessibility-value="Bitcoin">
                        <nuri-select-trigger-label>From</nuri-select-trigger-label>
                        <nuri-select-trigger-avatar name="bitcoin" variant="solid" accent="orange"></nuri-select-trigger-avatar>
                        <nuri-select-trigger-value>Bitcoin</nuri-select-trigger-value>
                        <nuri-select-trigger-chevron name="caret-down"></nuri-select-trigger-chevron>
                      </nuri-select-trigger>

                      <nuri-view fill="grow" justify="end" align="end">
                        <nuri-typography size="3xl" align="end">₿ 86969</nuri-typography>
                      </nuri-view>
                    </nuri-view>

                    <nuri-bleed top="xl" bottom="xl">
                      <nuri-view direction="row" justify="center" align="center" height="lg">
                        <nuri-icon-button
                          variant="solid"
                          icon="arrow-down"
                          aria-label="Swap Bitcoin and Euro"
                        ></nuri-icon-button>
                      </nuri-view>
                    </nuri-bleed>

                    <nuri-view chrome="subtle" radius="lg" padding-x="lg" height="xl" justify="center">
                      <nuri-view direction="row" justify="between" align="center">
                        <nuri-select-trigger aria-label="To" accessibility-value="Euro">
                          <nuri-select-trigger-label>To</nuri-select-trigger-label>
                          <nuri-select-trigger-avatar source="../assets/flags/eur.svg"></nuri-select-trigger-avatar>
                          <nuri-select-trigger-value>Euro</nuri-select-trigger-value>
                          <nuri-select-trigger-chevron name="caret-down"></nuri-select-trigger-chevron>
                        </nuri-select-trigger>
                        <nuri-typography size="md" emphasis>€ 48.18</nuri-typography>
                      </nuri-view>
                    </nuri-view>
                  </nuri-view>
                </nuri-scope>

                <nuri-view direction="column" gap="sm">
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>1</nuri-button>
                    <nuri-button>2</nuri-button>
                    <nuri-button>3</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>4</nuri-button>
                    <nuri-button>5</nuri-button>
                    <nuri-button>6</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>7</nuri-button>
                    <nuri-button>8</nuri-button>
                    <nuri-button>9</nuri-button>
                  </nuri-view>
                  <nuri-view direction="row" distribute="even" gap="sm">
                    <nuri-button>.</nuri-button>
                    <nuri-button>0</nuri-button>
                    <nuri-button aria-label="Delete"><nuri-button-icon name="chevron-left"></nuri-button-icon></nuri-button>
                  </nuri-view>
                </nuri-view>

                <nuri-view direction="row" distribute="even" gap="sm">
                  <nuri-button size="lg" variant="soft">Cancel</nuri-button>
                  <nuri-button size="lg" variant="solid" accent="lilac">Next</nuri-button>
                </nuri-view>
              </nuri-view>
            </nuri-scroll>
          </nuri-modal-panel>
        </nuri-modal>
      </nuri-screen>
    </template>
  </nuri-demo>

  <!-- MOVE · CURRENCY PICKER · bottom-sheet reference opened by either Move
       trigger (mode="sheet", content-height, keyboardless by contract — no
       search). Currency avatar, name, and trailing balance only. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="move · currency picker">
    <template>
      <nuri-screen>
        <nuri-view chrome="canvas" fill></nuri-view>

        <nuri-modal open mode="sheet" scrim="dim">
          <nuri-modal-panel>
            <nuri-header chrome="transparent">
              <nuri-topbar surface="transparent" layout="fluid">
                <nuri-topbar-content>
                  <nuri-topbar-title>Move from</nuri-topbar-title>
                </nuri-topbar-content>
                <nuri-topbar-trailing>
                  <nuri-icon-button icon="cross" variant="soft" aria-label="Close"></nuri-icon-button>
                </nuri-topbar-trailing>
              </nuri-topbar>
            </nuri-header>

            <nuri-scroll safe-area-bottom>
              <nuri-view direction="column" align="stretch" gap="sm" padding-bottom="lg">
                <!-- The unified-balance list grammar (the large-title board):
                     provider bands as labelled dividers, rows with the balance
                     inline-muted after the name. Selection rows, no navigation
                     chevron. -->
                <nuri-list>
                  <nuri-view direction="row" align="center" gap="sm" height="md" padding-x="md">
                    <nuri-view fill="grow"><nuri-separator y-space="none"></nuri-separator></nuri-view>
                    <nuri-typography size="sm" emphasis muted>Nuri wallet</nuri-typography>
                    <nuri-view fill="grow"><nuri-separator y-space="none"></nuri-separator></nuri-view>
                  </nuri-view>

                  <nuri-list-action aria-label="Bitcoin, 86969 sats, selected">
                    <nuri-list-action-leading-avatar source="../assets/logos/bitcoin.svg"></nuri-list-action-leading-avatar>
                    <nuri-list-action-text>Bitcoin</nuri-list-action-text>
                    <nuri-list-action-text-muted>86969 ₿</nuri-list-action-text-muted>
                    <nuri-list-action-trail-icon name="check-circle"></nuri-list-action-trail-icon>
                  </nuri-list-action>
                  <nuri-list-action aria-label="Euro, 100 euros">
                    <nuri-list-action-leading-avatar source="../assets/flags/eur.svg"></nuri-list-action-leading-avatar>
                    <nuri-list-action-text>Euro</nuri-list-action-text>
                    <nuri-list-action-text-muted>100.00 €</nuri-list-action-text-muted>
                  </nuri-list-action>
                  <nuri-list-action aria-label="Dollar, 74.60 dollars">
                    <nuri-list-action-leading-avatar source="../assets/flags/usa.svg"></nuri-list-action-leading-avatar>
                    <nuri-list-action-text>Dollar</nuri-list-action-text>
                    <nuri-list-action-text-muted>74.60 $</nuri-list-action-text-muted>
                  </nuri-list-action>

                  <nuri-view direction="row" align="center" gap="sm" height="md" padding-x="md">
                    <nuri-view fill="grow"><nuri-separator y-space="none"></nuri-separator></nuri-view>
                    <nuri-typography size="sm" emphasis muted>Arkade wallet</nuri-typography>
                    <nuri-view fill="grow"><nuri-separator y-space="none"></nuri-separator></nuri-view>
                  </nuri-view>

                  <nuri-list-action aria-label="Bitcoin Lightning, 0 sats">
                    <nuri-list-action-leading-avatar source="../assets/logos/lightning.svg"></nuri-list-action-leading-avatar>
                    <nuri-list-action-text>Bitcoin Lightning</nuri-list-action-text>
                    <nuri-list-action-text-muted>0 ₿</nuri-list-action-text-muted>
                  </nuri-list-action>

                  <nuri-view direction="row" align="center" gap="sm" height="md" padding-x="md">
                    <nuri-view fill="grow"><nuri-separator y-space="none"></nuri-separator></nuri-view>
                    <nuri-typography size="sm" emphasis muted>Wirex wallet</nuri-typography>
                    <nuri-view fill="grow"><nuri-separator y-space="none"></nuri-separator></nuri-view>
                  </nuri-view>

                  <nuri-list-action aria-label="Visa credit card, 34.45 euros">
                    <nuri-list-action-leading-avatar name="card" variant="outline"></nuri-list-action-leading-avatar>
                    <nuri-list-action-text>Visa credit card</nuri-list-action-text>
                    <nuri-list-action-text-muted>34.45 €</nuri-list-action-text-muted>
                  </nuri-list-action>
                  <nuri-list-action aria-label="IBAN account">
                    <nuri-list-action-leading-avatar name="bank" variant="outline"></nuri-list-action-leading-avatar>
                    <nuri-list-action-text>IBAN account</nuri-list-action-text>
                  </nuri-list-action>
                </nuri-list>
              </nuri-view>
            </nuri-scroll>
          </nuri-modal-panel>
        </nuri-modal>
      </nuri-screen>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
