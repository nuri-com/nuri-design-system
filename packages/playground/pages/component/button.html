<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Button</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
  <style>
    /* Page-local CHROME tweaks ONLY (the board row · the topbar) — NOT the
       device frame's content layout, which must stay RN-faithful (a screen
       fills the viewport, content flows from the top). Centering is done IN
       each example's composition instead (a filling, centering <nuri-stack> ·
       the web mirror of an RN <View flex:1 + center>):
         · the board panels butt together (no inter-panel gutter)
         · this bench is self-contained — hide the shell's DS cross-link */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Button">

  <!-- default · the Button with no axes set (resolves to the descriptor defaults).
       The <nuri-stack fill justify/align center> fills the screen and centers its
       content — the web mirror of an RN <View flex:1 + center>. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="default">
    <template>
      <nuri-stack direction="column" align="center" justify="center" gap="md" fill>
        <nuri-button>Button</nuri-button>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- sizes · the two-size scale (sm · lg) — lg is the default (shown above). -->
  <nuri-demo layout="board" controls="device,theme,accent" label="sizes">
    <template>
      <nuri-stack direction="column" align="center" justify="center" gap="md" fill>
        <nuri-button size="sm">Small</nuri-button>
        <nuri-button size="lg">Large</nuri-button>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- variant · solid · soft · + a per-instance accent override. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="variant">
    <template>
      <nuri-stack direction="column" align="center" justify="center" gap="md" fill>
        <nuri-button variant="solid">Solid</nuri-button>
        <nuri-button variant="soft">Soft</nuri-button>
        <nuri-button variant="solid" accent="orange">Solid accent</nuri-button>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- with icons · ordered ButtonText + ButtonIcon lockups: trailing icon · mid icon · leading icon. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="with icons">
    <template>
      <nuri-stack direction="column" align="center" justify="center" gap="md" fill>
        <nuri-button size="sm" variant="soft">
          <nuri-button-text>Copied</nuri-button-text>
          <nuri-button-icon name="check-circle"></nuri-button-icon>
        </nuri-button>
        <nuri-button size="sm" variant="solid">
          <nuri-button-text>Buy Bitcoin</nuri-button-text>
          <nuri-button-icon name="apple"></nuri-button-icon>
          <nuri-button-text>Pay</nuri-button-text>
        </nuri-button>
        <nuri-button size="lg" variant="solid" accent="lilac">
          <nuri-button-icon name="plus"></nuri-button-icon>
          <nuri-button-text>Add contact</nuri-button-text>
        </nuri-button>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- layout · buttons composed into a real screen via nested distribute="even" grids:
       a quick-amount chip row + the numpad (4 even rows, the last key icon-only) + a
       full-width Next. Container carries lg padding. (Section gap xl — 2xl is not in the
       gap vocab; SpaceLeaf caps at xl.) -->
  <nuri-demo layout="board" controls="device,theme,accent" label="layout">
    <template>
      <nuri-view direction="column" align="stretch" justify="end" gap="xl" padding="lg" fill>
        <!-- quick amounts · one even row of 4 sm solid chips -->
        <nuri-view direction="row" distribute="even" gap="sm">
          <nuri-button size="sm" variant="solid">€ 25</nuri-button>
          <nuri-button size="sm" variant="solid">€ 50</nuri-button>
          <nuri-button size="sm" variant="solid">€ 100</nuri-button>
          <nuri-button size="sm" variant="solid">€200</nuri-button>
        </nuri-view>

        <!-- numpad · 4 even rows of default (lg soft) keys; the last key is icon-only -->
        <nuri-view direction="column" gap="sm">
          <nuri-view direction="row" distribute="even" gap="sm">
            <nuri-button>1</nuri-button>
            <nuri-button>2</nuri-button>
            <nuri-button>3</nuri-button>
          </nuri-view>
          <nuri-view direction="row" distribute="even" gap="sm">
            <nuri-button>4</nuri-button>
            <nuri-button>5</nuri-button>
            <nuri-button>6</nuri-button>
          </nuri-view>
          <nuri-view direction="row" distribute="even" gap="sm">
            <nuri-button>7</nuri-button>
            <nuri-button>8</nuri-button>
            <nuri-button>9</nuri-button>
          </nuri-view>
          <nuri-view direction="row" distribute="even" gap="sm">
            <nuri-button>.</nuri-button>
            <nuri-button>0</nuri-button>
            <nuri-button><nuri-button-icon name="chevron-left"></nuri-button-icon></nuri-button>
          </nuri-view>
        </nuri-view>

        <!-- next · full-width solid lilac CTA (stretched by the column) -->
        <nuri-button variant="solid" accent="lilac">Next</nuri-button>
      </nuri-view>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
