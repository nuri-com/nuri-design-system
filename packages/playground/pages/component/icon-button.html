<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Icon Button</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
  <style>
    /* Page-local CHROME tweaks ONLY (the board row · the topbar). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    /* The playground shell's back affordance is a legacy <nuri-icon-button
       name="caret-left" label="…"> (lib/shell.js) — the OLD name/label API. This
       page LOADS the new factory-backed icon-button recipe, which registers
       <nuri-icon-button> globally and (rightly) does NOT route the legacy attrs,
       so the shell's back-button upgrades to an empty ghost box. Hide it here (it
       renders 0×0 / invisible on button.html anyway · the back-nav listener is
       unaffected). The shell adopting the new icon-button API + a caret glyph is a
       deliberate FOLLOW-UP for the operator — flagged at the checkpoint. */
    [data-pg-nav="index"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Icon Button">

  <!-- nudo · the icon-only round action across the variant surfaces (solid · soft ·
       ghost) — the bare control's parity oracle vs the legacy icon-button. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="nudo">
    <template>
      <nuri-stack direction="column" align="center" justify="center" gap="md" fill>
        <nuri-stack direction="row" align="center" justify="center" gap="md">
          <nuri-icon-button variant="solid" icon="apple" aria-label="Buy with Apple Pay"></nuri-icon-button>
          <nuri-icon-button variant="soft" icon="card" aria-label="Cards"></nuri-icon-button>
          <nuri-icon-button variant="ghost" icon="euro" aria-label="Euro"></nuri-icon-button>
        </nuri-stack>
        <nuri-stack direction="row" align="center" justify="center" gap="md">
          <nuri-icon-button size="sm" icon="bitcoin" aria-label="Bitcoin small"></nuri-icon-button>
          <nuri-icon-button size="md" icon="bitcoin" aria-label="Bitcoin medium"></nuri-icon-button>
          <nuri-icon-button size="lg" icon="bitcoin" aria-label="Bitcoin large"></nuri-icon-button>
        </nuri-stack>
      </nuri-stack>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
