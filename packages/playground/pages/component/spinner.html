<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Motion glyphs</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
</head>
<body>

<nuri-playground-shell doc="Motion glyphs">
  <nuri-demo layout="board" controls="device,theme,accent" label="activity · spinner">
    <template>
      <nuri-view direction="column" align="stretch" gap="lg" padding="xl" chrome="canvas" fill>
        <nuri-typography size="lg" emphasis>Staggered ring</nuri-typography>
        <nuri-view direction="row" align="center" justify="center" gap="xl" chrome="subtle" radius="lg" padding="lg">
          <nuri-icon name="spinner" size="sm"></nuri-icon>
          <nuri-icon name="spinner"></nuri-icon>
          <nuri-icon name="spinner" style="width:48px;height:48px"></nuri-icon>
        </nuri-view>
        <nuri-list>
          <nuri-list-action aria-label="To Wallet · Sending">
            <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
            <nuri-list-action-text>To Wallet</nuri-list-action-text>
            <nuri-list-action-text-muted>Sending now</nuri-list-action-text-muted>
            <nuri-list-action-trail-icon name="spinner"></nuri-list-action-trail-icon>
          </nuri-list-action>
        </nuri-list>
        <nuri-button size="lg" variant="solid" aria-label="Sending">
          <nuri-button-icon name="spinner"></nuri-button-icon>
          <nuri-button-text>Sending…</nuri-button-text>
        </nuri-button>
      </nuri-view>
    </template>
  </nuri-demo>

  <nuri-demo layout="board" controls="device,theme,accent" label="activity · spinner-ripple">
    <template>
      <nuri-view direction="column" align="stretch" gap="lg" padding="xl" chrome="canvas" fill>
        <nuri-typography size="lg" emphasis>Expanding ripple</nuri-typography>
        <nuri-view direction="row" align="center" justify="center" gap="xl" chrome="subtle" radius="lg" padding="lg">
          <nuri-icon name="spinner-ripple" size="sm"></nuri-icon>
          <nuri-icon name="spinner-ripple"></nuri-icon>
          <nuri-icon name="spinner-ripple" style="width:48px;height:48px"></nuri-icon>
        </nuri-view>
        <nuri-list>
          <nuri-list-action aria-label="Invoice · Generating">
            <nuri-list-action-leading-avatar name="bitcoin-wallet" variant="outline"></nuri-list-action-leading-avatar>
            <nuri-list-action-text>Bitcoin invoice</nuri-list-action-text>
            <nuri-list-action-text-muted>Generating now</nuri-list-action-text-muted>
            <nuri-list-action-trail-icon name="spinner-ripple"></nuri-list-action-trail-icon>
          </nuri-list-action>
        </nuri-list>
        <nuri-button size="lg" variant="solid" aria-label="Generating invoice">
          <nuri-button-icon name="spinner-ripple"></nuri-button-icon>
          <nuri-button-text>Generating…</nuri-button-text>
        </nuri-button>
      </nuri-view>
    </template>
  </nuri-demo>

  <nuri-demo layout="board" controls="device,theme,accent" label="activity · spinner-quarter">
    <template>
      <nuri-view direction="column" align="stretch" gap="lg" padding="xl" chrome="canvas" fill>
        <nuri-typography size="lg" emphasis>Quarter ripple</nuri-typography>
        <nuri-view direction="row" align="center" justify="center" gap="xl" chrome="subtle" radius="lg" padding="lg">
          <nuri-icon name="spinner-quarter" size="sm"></nuri-icon>
          <nuri-icon name="spinner-quarter"></nuri-icon>
          <nuri-icon name="spinner-quarter" style="width:48px;height:48px"></nuri-icon>
        </nuri-view>
        <nuri-list>
          <nuri-list-action aria-label="Payment · Broadcasting">
            <nuri-list-action-leading-avatar name="bitcoin" variant="outline"></nuri-list-action-leading-avatar>
            <nuri-list-action-text>Bitcoin payment</nuri-list-action-text>
            <nuri-list-action-text-muted>Broadcasting now</nuri-list-action-text-muted>
            <nuri-list-action-trail-icon name="spinner-quarter"></nuri-list-action-trail-icon>
          </nuri-list-action>
        </nuri-list>
        <nuri-button size="lg" variant="solid" aria-label="Broadcasting payment">
          <nuri-button-icon name="spinner-quarter"></nuri-button-icon>
          <nuri-button-text>Broadcasting…</nuri-button-text>
        </nuri-button>
      </nuri-view>
    </template>
  </nuri-demo>

  <nuri-demo layout="board" controls="device,theme,accent" label="activity · spinner-coin">
    <template>
      <nuri-view direction="column" align="stretch" gap="lg" padding="xl" chrome="canvas" fill>
        <nuri-typography size="lg" emphasis>Gradient coin flip</nuri-typography>
        <nuri-view direction="row" align="center" justify="center" gap="xl" chrome="subtle" radius="lg" padding="lg">
          <nuri-icon name="spinner-coin" size="sm"></nuri-icon>
          <nuri-icon name="spinner-coin"></nuri-icon>
          <nuri-icon name="spinner-coin" style="width:48px;height:48px"></nuri-icon>
        </nuri-view>
        <nuri-list>
          <nuri-list-action aria-label="Conversion · Processing">
            <nuri-list-action-leading-avatar name="transfer-horizontal" variant="outline"></nuri-list-action-leading-avatar>
            <nuri-list-action-text>Euro → Bitcoin</nuri-list-action-text>
            <nuri-list-action-text-muted>Processing now</nuri-list-action-text-muted>
            <nuri-list-action-trail-icon name="spinner-coin"></nuri-list-action-trail-icon>
          </nuri-list-action>
        </nuri-list>
        <nuri-button size="lg" variant="solid" aria-label="Processing conversion">
          <nuri-button-icon name="spinner-coin"></nuri-button-icon>
          <nuri-button-text>Processing…</nuri-button-text>
        </nuri-button>
      </nuri-view>
    </template>
  </nuri-demo>
</nuri-playground-shell>

</body>
</html>
