<nuri-playground-shell doc="Spinner Lab">


  <!-- Activity-screen context gallery · one candidate per screen. Each screen
       mirrors the first Bottom Sheet demo; only its first transaction animates. -->

  <nuri-demo layout="board" controls="device,theme,accent" label="activity · 2 staggered ring">
    <template>
      <nuri-view class="spinner-lab-sheet-stage spinner-lab--ring" direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-view class="spinner-lab-sheet-content" chrome="canvas" fill></nuri-view>

        <nuri-bottom-sheet open detent="full" scrim="dim">
          <nuri-bottom-sheet-panel>
            <nuri-header padding-top="lg">
              <nuri-topbar surface="transparent">
                <nuri-topbar-trailing>
                  <nuri-icon-button icon="download" variant="soft" aria-label="Download"></nuri-icon-button>
                  <nuri-icon-button icon="cross" variant="soft" aria-label="Close"></nuri-icon-button>
                </nuri-topbar-trailing>
              </nuri-topbar>
            </nuri-header>

            <nuri-scroll safe-area-bottom>
              <nuri-view class="spinner-lab-activity-layout" direction="column" align="stretch" justify="start" gap="md" padding-bottom="lg" fill>
                <nuri-view padding-x="lg">
                  <nuri-typography size="lg" emphasis>This month</nuri-typography>
                </nuri-view>
                <nuri-list>
                  <div class="spinner-lab-activity-row">
                    <nuri-list-action aria-label="To Wallet · Sending">
                      <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                      <nuri-list-action-text>To Wallet</nuri-list-action-text>
                      <nuri-list-action-text-muted>Sending · 10:24 am</nuri-list-action-text-muted>
                      <nuri-list-action-trailing-text>- 12.00 €</nuri-list-action-trailing-text>
                      <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
                    </nuri-list-action>
                    <span class="spinner-lab-glyph spinner-lab-activity-glyph" style="--spinner-size: 24px" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                  </div>
                  <nuri-list-separator></nuri-list-separator>
                  <nuri-list-action aria-label="Euro to Bitcoin">
                    <nuri-list-action-leading-avatar name="transfer-horizontal" variant="outline"></nuri-list-action-leading-avatar>
                    <nuri-list-action-text>Euro → Bitcoin</nuri-list-action-text>
                    <nuri-list-action-text-muted>Converted · Yesterday</nuri-list-action-text-muted>
                    <nuri-list-action-trailing-text>12.00 €</nuri-list-action-trailing-text>
                    <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
                  </nuri-list-action>
                  <nuri-list-separator></nuri-list-separator>
                  <nuri-list-action aria-label="To Izmir Köftecisi">
                    <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                    <nuri-list-action-text>To Izmir Köftecisi</nuri-list-action-text>
                    <nuri-list-action-text-muted>Paid · Sat, 4 Jul</nuri-list-action-text-muted>
                    <nuri-list-action-trailing-text>- 7.00 €</nuri-list-action-trailing-text>
                    <nuri-list-action-trailing-text-muted>2003 Sats</nuri-list-action-trailing-text-muted>
                  </nuri-list-action>
                </nuri-list>
                <nuri-view class="spinner-lab-status-panel" direction="column" align="center" justify="center" gap="md" variant="outline" radius="lg" padding="xl">
                  <span class="spinner-lab-glyph spinner-lab-status-glyph" style="--spinner-size: 36px" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                  <nuri-view direction="column" align="center" gap="xs" chrome="transparent">
                    <nuri-typography size="lg" emphasis align="center">Generating Bitcoin invoice</nuri-typography>
                    <nuri-typography size="md" muted align="center">It takes only a few seconds…</nuri-typography>
                  </nuri-view>
                </nuri-view>
              </nuri-view>
            </nuri-scroll>
          </nuri-bottom-sheet-panel>
        </nuri-bottom-sheet>
      </nuri-view>
    </template>
  </nuri-demo>

  <nuri-demo layout="board" controls="theme,accent" label="2 · staggered ring">
    <template>
      <section class="spinner-lab-card spinner-lab--ring">
        <header class="spinner-lab-card__header">
          <p class="spinner-lab-card__eyebrow">Candidate 2 · layered arcs</p>
          <h2>Staggered ring</h2>
          <p>Four top-border arcs share a path and trail one another through the turn.</p>
          <p class="spinner-lab-card__knobs"><code>duration</code> · <code>stagger</code> · <code>stroke: 1.5px</code> · <code>ease</code></p>
        </header>

        <div class="spinner-lab-sizes" aria-label="Staggered ring sizes">
          <span class="spinner-lab-size"><span class="spinner-lab-glyph" style="--spinner-size: 18px"><i></i><i></i><i></i><i></i></span><small>18</small></span>
          <span class="spinner-lab-size"><span class="spinner-lab-glyph" style="--spinner-size: 24px"><i></i><i></i><i></i><i></i></span><small>24</small></span>
          <span class="spinner-lab-size"><span class="spinner-lab-glyph" style="--spinner-size: 48px"><i></i><i></i><i></i><i></i></span><small>48</small></span>
        </div>

        <div class="spinner-lab-context" aria-label="Staggered ring in button and alert">
          <nuri-button class="spinner-lab-candidate-button" size="lg" variant="solid" accent="lilac" aria-label="Sending">
            <nuri-button-text><span class="spinner-lab-glyph spinner-lab-button-glyph" style="--spinner-size: 24px" aria-hidden="true"><i></i><i></i><i></i><i></i></span></nuri-button-text>
            <nuri-button-text>Sending…</nuri-button-text>
          </nuri-button>
          <nuri-alert class="spinner-lab-candidate-alert">
            <span class="spinner-lab-glyph spinner-lab-alert-glyph" style="--spinner-size: 18px" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <nuri-alert-icon name="warning-circle"></nuri-alert-icon>
            Payment is being processed
          </nuri-alert>
        </div>
      </section>
    </template>
  </nuri-demo>
