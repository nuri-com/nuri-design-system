<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Spinner</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
</head>
<body>

<nuri-playground-shell doc="Spinner">

  <nuri-demo layout="board" controls="device,theme,accent" label="activity · sending">
    <template>
      <nuri-view chrome="canvas" fill></nuri-view>

      <nuri-modal open mode="full" scroll-under-topbar>
        <nuri-modal-panel>
        <nuri-header safe-area-top chrome="transparent" safe-area-chrome="canvas">
          <nuri-topbar surface="transparent">
            <nuri-topbar-trailing>
              <nuri-icon-button icon="download" variant="soft" aria-label="Download"></nuri-icon-button>
              <nuri-icon-button icon="cross" variant="soft" aria-label="Close"></nuri-icon-button>
            </nuri-topbar-trailing>
          </nuri-topbar>
        </nuri-header>

        <nuri-scroll safe-area-bottom>
        <nuri-view direction="column" align="stretch" justify="start" gap="xl" padding-bottom="lg">
          <nuri-view direction="column" align="stretch" justify="start" gap="md">
            <nuri-view padding-x="lg">
              <nuri-typography size="lg" emphasis>This month</nuri-typography>
            </nuri-view>

            <nuri-list>
              <nuri-list-action aria-label="To Wallet · Processing">
                <nuri-list-action-leading-avatar name="spinner" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>To Wallet</nuri-list-action-text>
                <nuri-list-action-text-muted>Processing...</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- 12.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="Euro to Bitcoin">
                <nuri-list-action-leading-avatar name="transfer-horizontal" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Euro → Bitcoin</nuri-list-action-text>
                <nuri-list-action-text-muted>Converted · Yesterday</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>12.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="To Izmir Köftecisi">
                <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>To Izmir Köftecisi</nuri-list-action-text>
                <nuri-list-action-text-muted>Paid · Sat, 4 Jul</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- 7.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
            </nuri-list>
          </nuri-view>

          <nuri-view direction="column" align="stretch" justify="start" gap="md">
            <nuri-view padding-x="lg">
              <nuri-typography size="lg" emphasis>June</nuri-typography>
            </nuri-view>

            <nuri-list>
              <nuri-list-action aria-label="To Emin Mahrt">
                <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>To Emin Mahrt</nuri-list-action-text>
                <nuri-list-action-text-muted>Sent · Wed, 16 June</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- 12.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="From Emil Wagner">
                <nuri-list-action-leading-avatar name="plus" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>From Emil Wagner</nuri-list-action-text>
                <nuri-list-action-text-muted>Received · Wed, 16 June</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>12.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="From Wallet">
                <nuri-list-action-leading-avatar name="plus" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>From Wallet</nuri-list-action-text>
                <nuri-list-action-text-muted>Received · Wed, 16 June</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>12.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="To EASYJET AIR KCTJ253FI">
                <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>To EASYJET AIR KCTJ...</nuri-list-action-text>
                <nuri-list-action-text-muted>Paid · Wed, 16 June</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- 110.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="To Izmir Köftecisi">
                <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>To Izmir Köftecisi</nuri-list-action-text>
                <nuri-list-action-text-muted>Paid · Wed, 16 June</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- 7.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>3433 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
            </nuri-list>
          </nuri-view>

          <nuri-view direction="column" align="stretch" justify="start" gap="md">
            <nuri-view padding-x="lg">
              <nuri-typography size="lg" emphasis>May</nuri-typography>
            </nuri-view>

            <nuri-list>
              <nuri-list-action aria-label="To Wallet">
                <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>To Wallet</nuri-list-action-text>
                <nuri-list-action-text-muted>Sent · Fri, 30 May</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- 15.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>4291 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="From Emil Wagner">
                <nuri-list-action-leading-avatar name="plus" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>From Emil Wagner</nuri-list-action-text>
                <nuri-list-action-text-muted>Received · Thu, 29 May</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>22.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>6294 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="Euro to Bitcoin">
                <nuri-list-action-leading-avatar name="transfer-horizontal" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Euro → Bitcoin</nuri-list-action-text>
                <nuri-list-action-text-muted>Converted · Wed, 28 May</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>30.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>8582 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="To Izmir Köftecisi">
                <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>To Izmir Köftecisi</nuri-list-action-text>
                <nuri-list-action-text-muted>Paid · Tue, 27 May</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- 7.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>2003 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action aria-label="To EASYJET AIR KCTJ253FI">
                <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>To EASYJET AIR KCTJ...</nuri-list-action-text>
                <nuri-list-action-text-muted>Paid · Mon, 26 May</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- 84.00 €</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>24041 Sats</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
            </nuri-list>
          </nuri-view>
        </nuri-view>
        </nuri-scroll>
        </nuri-modal-panel>
      </nuri-modal>
    </template>
  </nuri-demo>

  <nuri-demo layout="board" controls="device,theme,accent" label="actions · loading">
    <template>
      <nuri-view direction="column" align="stretch" justify="center" gap="xl" padding="lg" chrome="canvas" fill>
        <nuri-view direction="row" align="center" justify="center" gap="lg">
          <nuri-icon-button icon="download" aria-label="Download"></nuri-icon-button>
          <nuri-icon-button icon="spinner" aria-label="Loading"></nuri-icon-button>
        </nuri-view>

        <nuri-view direction="row" align="center" distribute="even" gap="sm">
          <nuri-button size="lg">
            <nuri-button-text>Cancel</nuri-button-text>
          </nuri-button>
          <nuri-button size="lg" variant="solid" accent="lilac" aria-label="Saving">
            <nuri-button-icon name="spinner"></nuri-button-icon>
          </nuri-button>
        </nuri-view>
      </nuri-view>
    </template>
  </nuri-demo>
</nuri-playground-shell>

</body>
</html>
