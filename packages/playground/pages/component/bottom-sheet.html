<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Dev cache busting · see README.md "Dev cache caveat" for rationale. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Nuri · Playground · Bottom Sheet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />

  <!--
    ═══════════════════════════════════════════════════════════════
    PLAYGROUND · DOCUMENT · BOTTOM SHEET (primitive structure + descriptor chrome)
    ═══════════════════════════════════════════════════════════════
    Three board proofs for the static web mirror of the RN bottom-sheet family:
    content detent + dim scrim, full detent + scroll content + dim scrim, and a
    camera/background overlay with no scrim. The structural wrapper stays the
    runtime primitive (<nuri-bottom-sheet>), while the visual sheet surface stays
    descriptor-backed (<nuri-bottom-sheet-panel>).

    Composed from the ACTIVE set only — bottom-sheet primitive, bottom-sheet-panel
    descriptor recipe, standard Nuri primitives/components, and the shared
    @nuri/prototype demo layer. ZERO import from @nuri/doc (the DAG stays
    playground → prototype → spec).
    ═══════════════════════════════════════════════════════════════
  -->

  <!-- The playground is a FIXED light + cream surface (decision 57): no page-level
       toggle — each <nuri-demo> scopes its OWN theme/accent locally. -->
  <script>
    document.documentElement.dataset.theme = 'light';
    document.documentElement.dataset.neutral = 'cream';
    document.documentElement.dataset.accent = 'neutral';
  </script>

  <!-- Token cake + base reset + type scale (the foundation · the web projection's generated output). -->
  <link rel="stylesheet" href="../../../prototype/generated/styles/tokens-primitive.css" />
  <link rel="stylesheet" href="../../../prototype/generated/styles/tokens-semantic.css" />
  <link rel="stylesheet" href="../../../prototype/generated/styles/shell.css" />
  <link rel="stylesheet" href="../../../prototype/generated/styles/typography.css" />

  <!-- Active components — the bottom-sheet recipe's primitives + the shared demo layer. -->
  <link rel="stylesheet" href="../../../prototype/primitives/icon.css" />
  <link rel="stylesheet" href="../../../prototype/primitives/pressable.css" />
  <link rel="stylesheet" href="../../../prototype/primitives/view.css" />
  <link rel="stylesheet" href="../../../prototype/styles/typography.css" />
  <link rel="stylesheet" href="../../../prototype/styles/stack.css" />
  <link rel="stylesheet" href="../../../prototype/styles/box.css" />
  <link rel="stylesheet" href="../../../prototype/styles/palette.css" />
  <link rel="stylesheet" href="../../../prototype/styles/interactive.css" />
  <link rel="stylesheet" href="../../../prototype/styles/effect.css" />
  <link rel="stylesheet" href="../../../prototype/factory/reset.css" />
  <link rel="stylesheet" href="../../../prototype/recipes/bottom-sheet.css" />
  <link rel="stylesheet" href="../../../prototype/demo/control.css" />
  <link rel="stylesheet" href="../../../prototype/demo/demo.css" />
  <!-- The playground area shell (topbar + the board scroll container). -->
  <link rel="stylesheet" href="../../lib/shell.css" />

  <!-- The standalone playground's NuriState seed (theme + spec-derived accent). -->
  <script src="../../../prototype/demo/available.js" type="module"></script>

  <!-- Shell first (mirrors the DS order): it reparents the authored <nuri-demo>
       panels into its built <main>, so it must run before the demos compose. -->
  <script src="../../lib/shell.js" defer></script>

  <!-- Custom element scripts MUST be deferred so connectedCallback fires AFTER body
       parsing. The recipes self-import their primitives (idempotent define-guards). -->
  <script src="../../../prototype/demo/control.js" defer></script>
  <script src="../../../prototype/primitives/scope.js" defer></script>
  <script src="../../../prototype/primitives/icon.js" type="module"></script>
  <script src="../../../prototype/primitives/view.js" type="module"></script>
  <script src="../../../prototype/primitives/typography.js" defer></script>
  <script src="../../../prototype/primitives/stack.js" defer></script>
  <script src="../../../prototype/recipes/button.js" type="module"></script>
  <script src="../../../prototype/recipes/icon-button.js" type="module"></script>
  <script src="../../../prototype/recipes/topbar.js" type="module"></script>
  <script src="../../../prototype/recipes/bottom-sheet.js" type="module"></script>
  <script src="../../../prototype/demo/demo.js" defer></script>

  <style>
    /* Page-local HARNESS only: board chrome, static scene backgrounds, and the
       containing block the absolutely positioned sheet needs inside the phone
       viewport. Sheet panel radius/elevation come from the descriptor axes. */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }

    .sheet-stage {
      position: relative;
      overflow: hidden;
      min-block-size: 0;
    }

    .sheet-stage--camera {
      background:
        radial-gradient(circle at 34% 21%, rgba(255, 255, 255, 0.78), transparent 25%),
        linear-gradient(150deg, #18261f 0%, #49715e 38%, #d9c4a1 70%, #6c5042 100%);
      color: white;
    }

    .sheet-content {
      position: relative;
      z-index: 0;
    }

    .sheet-reticle {
      position: absolute;
      inset-block-start: 116px;
      inset-inline: 40px;
      block-size: 220px;
      border: var(--nuri-border-1) solid rgba(255, 255, 255, 0.72);
      border-radius: var(--nuri-radius-lg);
      box-shadow: inset 0 0 0 999px rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }
  </style>
</head>
<body>

<nuri-playground-shell doc="Bottom Sheet">

  <!-- content · a content-height sheet with dimmed background. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="content / dim">
    <template>
      <nuri-view class="sheet-stage" chrome="subtle" fill>
        <nuri-view class="sheet-content" padding-x="lg" padding-top="lg">
          <nuri-stack direction="column" gap="md">
            <nuri-topbar>
              <nuri-topbar-center>
                <nuri-typography size="md" emphasis>Wallet</nuri-typography>
              </nuri-topbar-center>
            </nuri-topbar>
            <nuri-view chrome="canvas" radius="lg" padding="lg">
              <nuri-stack direction="column" gap="xs">
                <nuri-typography size="sm" muted>Available</nuri-typography>
                <nuri-typography size="xl" emphasis>€ 1,248.90</nuri-typography>
              </nuri-stack>
            </nuri-view>
            <nuri-view chrome="canvas" radius="lg" padding="lg">
              <nuri-stack direction="column" gap="xs">
                <nuri-typography size="sm" muted>Bitcoin</nuri-typography>
                <nuri-typography size="md" emphasis>0.0248 BTC</nuri-typography>
              </nuri-stack>
            </nuri-view>
          </nuri-stack>
        </nuri-view>

        <nuri-bottom-sheet open detent="content" scrim="dim">
          <nuri-bottom-sheet-panel>
            <nuri-view padding="lg">
              <nuri-stack direction="column" gap="md">
                <nuri-typography size="lg" emphasis>Receive bitcoin</nuri-typography>
                <nuri-typography size="sm" muted>Share an address or scan from another wallet.</nuri-typography>
                <nuri-button variant="solid">Show address</nuri-button>
              </nuri-stack>
            </nuri-view>
          </nuri-bottom-sheet-panel>
        </nuri-bottom-sheet>
      </nuri-view>
    </template>
  </nuri-demo>

  <!-- full-scroll · full-height sheet with internal scrolling content. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="full-scroll / dim">
    <template>
      <nuri-view class="sheet-stage" chrome="subtle" fill>
        <nuri-view class="sheet-content" padding-x="lg" padding-top="lg">
          <nuri-stack direction="column" gap="md">
            <nuri-topbar>
              <nuri-topbar-center>
                <nuri-typography size="md" emphasis>Activity</nuri-typography>
              </nuri-topbar-center>
            </nuri-topbar>
            <nuri-view chrome="canvas" radius="lg" padding="lg">
              <nuri-stack direction="column" gap="xs">
                <nuri-typography size="sm" muted>Recent payments are visible behind the dimmed sheet.</nuri-typography>
                <nuri-typography size="md" emphasis>12 movements this week</nuri-typography>
              </nuri-stack>
            </nuri-view>
          </nuri-stack>
        </nuri-view>

        <nuri-bottom-sheet open detent="full" scrim="dim">
          <nuri-bottom-sheet-panel>
            <nuri-topbar surface="transparent">
              <nuri-topbar-center>
                <nuri-typography size="md" emphasis>Choose account</nuri-typography>
              </nuri-topbar-center>
            </nuri-topbar>
            <nuri-bottom-sheet-scroll>
              <nuri-view padding="lg">
                <nuri-stack direction="column" gap="sm">
                  <nuri-button variant="soft">Main wallet</nuri-button>
                  <nuri-button variant="ghost">Savings</nuri-button>
                  <nuri-button variant="ghost">Trading</nuri-button>
                  <nuri-button variant="ghost">Travel card</nuri-button>
                  <nuri-button variant="ghost">Emergency fund</nuri-button>
                  <nuri-button variant="ghost">Cold storage</nuri-button>
                  <nuri-button variant="ghost">Family pocket</nuri-button>
                  <nuri-button variant="ghost">Euro cash</nuri-button>
                  <nuri-button variant="ghost">Lightning</nuri-button>
                  <nuri-button variant="ghost">Archive</nuri-button>
                </nuri-stack>
              </nuri-view>
            </nuri-bottom-sheet-scroll>
          </nuri-bottom-sheet-panel>
        </nuri-bottom-sheet>
      </nuri-view>
    </template>
  </nuri-demo>

  <!-- camera · no scrim, so the preview stays visible behind the sheet. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="camera / no-scrim">
    <template>
      <nuri-view class="sheet-stage sheet-stage--camera" fill>
        <div class="sheet-reticle"></div>
        <nuri-view class="sheet-content" padding-x="lg" padding-top="lg">
          <nuri-topbar surface="transparent">
            <nuri-topbar-center>
              <nuri-typography size="md" emphasis>Scan QR</nuri-typography>
            </nuri-topbar-center>
          </nuri-topbar>
        </nuri-view>

        <nuri-bottom-sheet open detent="content" scrim="none">
          <nuri-bottom-sheet-panel>
            <nuri-view padding="lg">
              <nuri-stack direction="column" gap="md">
                <nuri-typography size="lg" emphasis>Scan QR</nuri-typography>
                <nuri-typography size="sm" muted>Camera preview remains visible without a scrim.</nuri-typography>
                <nuri-button variant="soft">Enter address manually</nuri-button>
              </nuri-stack>
            </nuri-view>
          </nuri-bottom-sheet-panel>
        </nuri-bottom-sheet>
      </nuri-view>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
