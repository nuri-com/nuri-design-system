  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
  <style>
    /* Page-local HARNESS only: containing block for the absolutely positioned
       sheets inside the phone viewport. Sheet panel chrome comes from the
       descriptor axes. */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }

    .sheet-stage {
      position: relative;
      overflow: hidden;
      min-block-size: 0;
    }

    .sheet-content {
      position: relative;
      z-index: 0;
    }

  </style>
</head>
