<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Topbar</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
  <style>
    /* Page-local CHROME tweaks ONLY (the board row · the topbar). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Topbar">

  <!-- app bar · the canonical pattern: a back affordance (leading) · a title
       (center) · an action (trailing). The title lands at the bar's true centre. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="app bar">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon-button icon="caret-left" variant="ghost" aria-label="Back"></nuri-icon-button>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-typography size="md" emphasis>Account</nuri-typography>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="card" variant="soft" aria-label="Wallet"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- actions · a menu (leading) · a brand mark (center) · two trailing actions —
       the trailing region holds more than the leading, yet the brand stays centred. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="actions">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon-button icon="caret-left" variant="ghost" aria-label="Menu"></nuri-icon-button>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-typography size="md" emphasis>Nuri</nuri-typography>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-stack direction="row" align="center" gap="xs">
              <nuri-button size="sm" variant="ghost">Skip</nuri-button>
              <nuri-button size="sm" variant="solid">Next</nuri-button>
            </nuri-stack>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- default slot · BARE children of <nuri-topbar> (no region wrapper) collect into
       the trailing region — the "just actions" case. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="default slot">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-button size="sm" variant="soft">Done</nuri-button>
        </nuri-topbar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- TRUE CENTRE · the forcing function. Two bars share an identical centre glyph
       (bitcoin). TOP bar: SYMMETRIC edges (a small icon each side). BOTTOM bar:
       ASYMMETRIC edges (a tiny leading icon vs a LARGE trailing icon-button). The
       two centre glyphs align on the SAME vertical line — proof that the asymmetric
       edge does not shove the centre (the `even`-flex edges split the leftover row
       equally · the centre is dead-centre regardless). -->
  <nuri-demo layout="board" controls="device,theme,accent" label="true centre">
    <template>
      <nuri-stack direction="column" align="stretch" justify="center" gap="lg" fill>
        <nuri-topbar>
          <nuri-topbar-leading><nuri-icon name="caret-left"></nuri-icon></nuri-topbar-leading>
          <nuri-topbar-center><nuri-icon name="bitcoin"></nuri-icon></nuri-topbar-center>
          <nuri-topbar-trailing><nuri-icon name="card"></nuri-icon></nuri-topbar-trailing>
        </nuri-topbar>
        <nuri-topbar>
          <nuri-topbar-leading><nuri-icon name="caret-left"></nuri-icon></nuri-topbar-leading>
          <nuri-topbar-center><nuri-icon name="bitcoin"></nuri-icon></nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-icon-button size="lg" variant="solid" icon="apple" aria-label="Pay"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-stack>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
