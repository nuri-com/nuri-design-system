<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Topbar</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
  <style>
    /* Page-local CHROME tweaks ONLY (the board row · the topbar). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="index"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Topbar">

  <!-- topbar · brand mark (leading) · two default actions (trailing). Bare
       icon-buttons in the trailing region space by the region's own gap. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="topbar">
    <template>
      <nuri-view direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="list-bullets" aria-label="List"></nuri-icon-button>
            <nuri-icon-button icon="headphones" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-view>
    </template>
  </nuri-demo>

  <!-- centered · brand mark (leading) · a composed Button lockup (center) · a
       default action (trailing). The centre button lands at the bar's true centre. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="centered">
    <template>
      <nuri-view direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-button size="sm" variant="solid">
              <nuri-button-text>Buy Bitcoin</nuri-button-text>
              <nuri-button-icon name="apple"></nuri-button-icon>
              <nuri-button-text>Pay</nuri-button-text>
            </nuri-button>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="headphones" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-view>
    </template>
  </nuri-demo>

  <!-- modal · a single default close action. BARE child of <nuri-topbar> (no region
       wrapper) sinks to the trailing region → right-aligned by the region's justify. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="modal">
    <template>
      <nuri-view direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-icon-button icon="cross" aria-label="Close"></nuri-icon-button>
        </nuri-topbar>
      </nuri-view>
    </template>
  </nuri-demo>

  <!-- flow · a back + close pair. Both BARE children sink to the trailing region and
       space by its gap; no wrapper stack. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="flow">
    <template>
      <nuri-view direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-icon-button icon="chevron-left" aria-label="Back"></nuri-icon-button>
          <nuri-icon-button icon="cross" aria-label="Close"></nuri-icon-button>
        </nuri-topbar>
      </nuri-view>
    </template>
  </nuri-demo>

  <!-- modal with title · a leading title (left) · a default close action (trailing). -->
  <nuri-demo layout="board" controls="device,theme,accent" label="modal with title">
    <template>
      <nuri-view direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-typography size="lg" emphasis>Settings</nuri-typography>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="cross" aria-label="Close"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-view>
    </template>
  </nuri-demo>

  <!-- edit · a Cancel text button (leading) · a centred title (center) · a Save
       solid button (trailing). The two even edges keep the title dead-centre. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="edit">
    <template>
      <nuri-view direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-button size="sm">Cancel</nuri-button>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-typography size="lg" emphasis>Edit</nuri-typography>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-button size="sm" variant="solid">Save</nuri-button>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-view>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
