<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Icon Avatar</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
  <style>
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Icon Avatar">

  <nuri-demo layout="board" controls="device,theme,accent" label="variants">
    <template>
      <nuri-stack direction="column" align="center" justify="center" gap="lg" fill>
        <nuri-stack direction="row" align="center" justify="center" gap="md" wrap>
          <nuri-stack direction="column" align="center" gap="xs">
            <nuri-icon-avatar variant="solid" icon="wallet"></nuri-icon-avatar>
            <nuri-typography size="xs">solid</nuri-typography>
          </nuri-stack>
          <nuri-stack direction="column" align="center" gap="xs">
            <nuri-icon-avatar variant="soft" icon="card"></nuri-icon-avatar>
            <nuri-typography size="xs">soft</nuri-typography>
          </nuri-stack>
          <nuri-stack direction="column" align="center" gap="xs">
            <nuri-icon-avatar variant="ghost" icon="bitcoin"></nuri-icon-avatar>
            <nuri-typography size="xs">ghost</nuri-typography>
          </nuri-stack>
          <nuri-stack direction="column" align="center" gap="xs">
            <nuri-icon-avatar variant="subtle" icon="settings"></nuri-icon-avatar>
            <nuri-typography size="xs">subtle</nuri-typography>
          </nuri-stack>
          <nuri-stack direction="column" align="center" gap="xs">
            <nuri-icon-avatar variant="outline" icon="wallet"></nuri-icon-avatar>
            <nuri-typography size="xs">outline</nuri-typography>
          </nuri-stack>
        </nuri-stack>
      </nuri-stack>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
