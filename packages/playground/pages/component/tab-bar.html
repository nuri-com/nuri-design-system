<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Tab bar</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
  <style>
    /* Page-local CHROME tweaks ONLY (the board row). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Tab bar">

  <!-- ISOLATION · the bar's states side by side: ONE selected (text-primary) vs the
       others unselected (the receded border-strong) — the colour-only treatment
       (no icon weights · decision 38). pressScale on tap (no bg change). -->
  <nuri-demo layout="board" controls="device,theme,accent" label="states">
    <template>
      <nuri-view direction="column" align="stretch" justify="center" gap="md" fill>
        <nuri-tab-bar>
          <nuri-tab-bar-item selected aria-label="Wallet">
            <nuri-tab-bar-item-icon name="wallet"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 36.50</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
          <nuri-tab-bar-item aria-label="Cards">
            <nuri-tab-bar-item-icon name="card"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 18.90</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
          <nuri-tab-bar-item aria-label="Bank">
            <nuri-tab-bar-item-icon name="bank"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 25.70</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-view>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
