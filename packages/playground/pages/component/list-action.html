<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · List Action</title>
  <link rel="stylesheet" href="../../generated/playground.css" />
  <script src="../../generated/boot.js" type="module"></script>
</head>
<body>

<nuri-playground-shell doc="List Action">

  <!-- sources · solid accent avatars (a filled orange/lilac disc) + a chevron. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="sources">
    <template>
      <nuri-list>
        <nuri-list-action aria-label="Poland, plus 54">
          <nuri-list-action-leading-avatar source="../../assets/flags/pol.svg"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>Poland</nuri-list-action-text>
          <nuri-list-action-trailing-text>+54</nuri-list-action-trailing-text>
        </nuri-list-action>
        <nuri-list-separator></nuri-list-separator>
        <nuri-list-action aria-label="From Bitcoin Wallet">
          <nuri-list-action-leading-avatar name="wallet" variant="solid" accent="orange"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>From Bitcoin Wallet</nuri-list-action-text>
          <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
        </nuri-list-action>
        <nuri-list-separator></nuri-list-separator>
        <nuri-list-action aria-label="From Cash Account">
          <nuri-list-action-leading-avatar name="bank" variant="solid" accent="lilac"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>From Cash Account</nuri-list-action-text>
          <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
        </nuri-list-action>
      </nuri-list>
    </template>
  </nuri-demo>

  <!-- transactions · outline avatars + a two-line content stack + a trailing value
       stack. EUR↔Sats are consistent at ~€54.8k/BTC (~1825 sats/€). -->
  <nuri-demo layout="board" controls="device,theme,accent" label="transactions">
    <template>
      <nuri-list>
        <nuri-list-action aria-label="To Emin Mahrt, minus 18 euros">
          <nuri-list-action-leading-avatar name="arrow-up" variant="outline"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>To Emin Mahrt</nuri-list-action-text>
          <nuri-list-action-text-muted>Sent • Tue, 4 Mar</nuri-list-action-text-muted>
          <nuri-list-action-trailing-text>− 18 €</nuri-list-action-trailing-text>
          <nuri-list-action-trailing-text-muted>32845 Sats</nuri-list-action-trailing-text-muted>
        </nuri-list-action>
        <nuri-list-separator></nuri-list-separator>
        <nuri-list-action aria-label="From Wallet, 7 euros 20">
          <nuri-list-action-leading-avatar name="plus" variant="outline"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>From Wallet</nuri-list-action-text>
          <nuri-list-action-text-muted>Received • Fri, 21 Feb</nuri-list-action-text-muted>
          <nuri-list-action-trailing-text>7.20 €</nuri-list-action-trailing-text>
          <nuri-list-action-trailing-text-muted>13138 Sats</nuri-list-action-trailing-text-muted>
        </nuri-list-action>
        <nuri-list-separator></nuri-list-separator>
        <nuri-list-action aria-label="Euro to Bitcoin, 50 euros">
          <nuri-list-action-leading-avatar name="transfer-horizontal" variant="outline"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>Euro → Bitcoin</nuri-list-action-text>
          <nuri-list-action-text-muted>Move • Mon, 17 Feb</nuri-list-action-text-muted>
          <nuri-list-action-trailing-text>50 €</nuri-list-action-trailing-text>
          <nuri-list-action-trailing-text-muted>91235 Sats</nuri-list-action-trailing-text-muted>
        </nuri-list-action>
      </nuri-list>
    </template>
  </nuri-demo>

  <!-- people (#231) · person rows carry initials + the rail accessory: Nuri users on the
       inverse disc, every other rail on the canvas disc. The initials stay soft although the
       row forwards its outline default (the mode lock). The accessory is decorative, so each
       row names its rail in the label ("Nuri user", "N26 account"…), never only by the glyph.
       Actions in the same list keep the outline glyph avatar. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="people">
    <template>
      <nuri-list>
        <nuri-list-action aria-label="Emil Berg, Nuri user, @emil">
          <nuri-list-action-leading-avatar initials="EB" accessory="nuri" accessory-surface="inverse"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>Emil Berg</nuri-list-action-text>
          <nuri-list-action-text-muted>@emil</nuri-list-action-text-muted>
          <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
        </nuri-list-action>
        <nuri-list-action aria-label="Claude M., N26 account ending 4521">
          <nuri-list-action-leading-avatar initials="CM" accessory="bank"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>Claude M.</nuri-list-action-text>
          <nuri-list-action-text-muted>N26 ···4521</nuri-list-action-text-muted>
          <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
        </nuri-list-action>
        <nuri-list-action aria-label="Anna K., Bitcoin address bc1q…9m7t">
          <nuri-list-action-leading-avatar initials="AK" accessory="bitcoin"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>Anna K.</nuri-list-action-text>
          <nuri-list-action-text-muted>bc1q…9m7t</nuri-list-action-text-muted>
          <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
        </nuri-list-action>
        <nuri-list-action aria-label="New recipient">
          <nuri-list-action-leading-avatar name="plus" variant="outline"></nuri-list-action-leading-avatar>
          <nuri-list-action-text>New recipient</nuri-list-action-text>
          <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
        </nuri-list-action>
      </nuri-list>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
