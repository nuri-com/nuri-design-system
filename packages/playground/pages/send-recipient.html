<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Avatar exploration (outside the DS)</title>
  <link rel="stylesheet" href="../generated/playground.css" />
  <script src="../generated/boot.js" type="module"></script>
  <!-- OUTSIDE THE DS · page-local CSS on purpose. Not a pattern to copy. -->
  <style data-outside-ds>
    /* OUTSIDE THE DS · page-local CSS on purpose: the target the avatar admission must make unnecessary. */
    .xav { position: relative; flex: none; width: 48px; height: 48px; border-radius: 999px;
           display: inline-flex; align-items: center; justify-content: center;
           font: 600 15px/1 inherit; letter-spacing: .02em; color: var(--nuri-text-primary); }
    .xav img { width: 100%; height: 100%; border-radius: 999px; object-fit: cover; }
    /* initials content = the icon-avatar soft treatment (bg-strong, text-primary) */
    .xav--soft { background: var(--nuri-bg-strong); color: var(--nuri-text-primary); }
    /* accessory: bottom-right, 22px, 2px ring in the surface colour, glyph from the icon set */
    .xbadge { position: absolute; right: -3px; bottom: -3px; width: 22px; height: 22px; border-radius: 999px;
              display: inline-flex; align-items: center; justify-content: center;
              box-shadow: 0 0 0 2px var(--nuri-bg-canvas); }
    .xbadge nuri-icon { transform: scale(.72); }
    /* solid + accent neutral = Nuri (dark fill, light glyph) */
    .xbadge--solid { background: var(--nuri-accent-solid); color: var(--nuri-accent-on-solid); }
    /* outline = every other rail: canvas fill, hairline, text-primary glyph (16.03:1, not muted 5.85:1) */
    .xbadge--outline-strong { background: var(--nuri-bg-canvas); color: var(--nuri-text-primary);
                              box-shadow: 0 0 0 2px var(--nuri-bg-canvas), inset 0 0 0 1px var(--nuri-border-subtle); }
    /* person rows are hand-built (icon-avatar takes no initials): copy the DS trailing chevron (palette subtle) */
    [data-xchev] { color: var(--nuri-border-strong); }
  </style>
</head>
<body>

<!--
  ⚠ DISCLAIMER · OUTSIDE THE DESIGN SYSTEM (2026-10-24)
  This page is NOT the norm and NOT DS composition. It uses page-local CSS to draw the
  TARGET for the icon-avatar change the send journey needs, as evidence for an admission
  request (docs/design-system-admission.md). Nothing here is adopted until that request
  is accepted; when it is, this page is deleted and send.html uses the real avatar.

  Target (X17): people = initials on the soft avatar; a rail accessory bottom-right;
  Nuri = solid neutral (black), every other rail = outline with a text-primary glyph.
  X19: the same accessory on an image avatar (Nuri users with a profile photo; sample
  portraits from randomuser.me, placeholders only). X16: what nuri-expo draws today
  (vendored wordpet pixel pets), kept as the reference the target replaces in lists.
  Explored and dropped (2026-10-24): pastel / Radix / hue-wheel person tones, coloured
  rail badges (orange Bitcoin, lilac bank), Nuri lilac, all-black badges, KYC check.
-->

       soft initials + rail accessory. The one solid accessory is Nuri. -->

                  <nuri-typography size="sm" muted>N26 ···4521</nuri-typography>
                </nuri-view>
                  <nuri-icon name="chevron-right" data-xchev></nuri-icon>
              </nuri-view>
              <nuri-view direction="row" align="center" gap="md" padding-x="lg" height="xl">
                <span class="xav xav--soft" aria-hidden="true">SC<span class="xbadge xbadge--solid" data-accent="neutral"><nuri-icon name="nuri" size="sm"></nuri-icon></span></span>
                <nuri-view direction="column" align="start" fill="grow-shrink">
                  <nuri-typography size="md" emphasis>Sara Conti</nuri-typography>
                  <nuri-typography size="sm" muted>@sarac</nuri-typography>
                </nuri-view>
                  <nuri-icon name="chevron-right" data-xchev></nuri-icon>
              </nuri-view>
              <nuri-view direction="row" align="center" gap="md" padding-x="lg" height="xl">
                <span class="xav xav--soft" aria-hidden="true">AK<span class="xbadge xbadge--outline-strong"><nuri-icon name="bitcoin" size="sm"></nuri-icon></span></span>
                <nuri-view direction="column" align="start" fill="grow-shrink">

                  <nuri-typography size="sm" muted>bc1q…9m7t</nuri-typography>

                  <nuri-icon name="chevron-right" data-xchev></nuri-icon>
              </nuri-view>

                  <nuri-list-action aria-label="All contacts">

                    <nuri-list-action-text>All contacts</nuri-list-action-text>
                    <nuri-list-action-text-muted>15 saved</nuri-list-action-text-muted>
