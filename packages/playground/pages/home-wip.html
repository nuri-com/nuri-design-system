  <!-- OUTSIDE THE DS · page-local CSS for the EXPERIMENT boards only. Not a pattern to copy. -->
  <style data-outside-ds>
    /* EXPERIMENT · home 1d (2026-11-20). The view has radius-top but no radius-bottom:
       the stack's last segment (the Bank & card card) rounds its bottom corners only. */
    nuri-view[data-x-radius-bottom="lg"] { border-end-start-radius: var(--nuri-radius-lg); border-end-end-radius: var(--nuri-radius-lg); }
    /* EXPERIMENT · census boards (2026-11-20). The DS icon set has no "more" (three dots):
       the icon-button keeps a placeholder glyph, hidden, and draws three dots in its place. */
    nuri-icon-button[data-x-more] nuri-icon svg { visibility: hidden; }
    nuri-icon-button[data-x-more] nuri-icon { background: radial-gradient(circle at center, currentColor 2.2px, transparent 2.8px) center / 8px 24px repeat-x; }
    /* EXPERIMENT · census 2. More as tall as Send and Receive: the icon-button is a fixed
       48 (size lg), the lg button is 60 (size xl). */
    nuri-icon-button[data-x-tall] button { min-height: var(--nuri-size-xl); min-width: var(--nuri-size-xl); }
    /* EXPERIMENT · card · balance (2026-11-20). The image element always draws a 1px ring
       (border-translucent, black 10%); around the upright card art, letterboxed in a wider
       box with square corners, it reads as a dirty frame. The art carries its own edge. */
    nuri-image[data-x-no-ring] img { border: 0; }
  </style>
</head>
