<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Dev cache busting · see README.md "Dev cache caveat" for rationale. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Nuri · Playground · Tab bar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />

  <!--
    ═══════════════════════════════════════════════════════════════
    PLAYGROUND · DOCUMENT · TAB BAR (the bottom bar · presentation only)
    ═══════════════════════════════════════════════════════════════
    THE PAYOFF — three REAL screens composed from the catalog pieces (topbar +
    balance + two Buttons + the tab-bar), one active destination each. The DS is
    DUMB: <nuri-tab-bar> is an OPEN row that lays out its <nuri-tab> children as
    EQUAL columns and nothing else; each <nuri-tab> just LOOKS selected or not
    (the `selected` boolean → the ghost/subtle colour treatment) and fires its
    press. NO value / state / routing in the DS — the consuming app owns `active`.

    Plus an ISOLATION board (the item states side by side: one selected, two not).

    Composed from the ACTIVE set only — the tab-bar/topbar/button/icon-button
    recipes + the shared @nuri/prototype demo layer. ZERO import from @nuri/doc
    (the DAG stays playground → prototype → spec · decision 68).
    ═══════════════════════════════════════════════════════════════
  -->

  <!-- The playground is a FIXED light + cream surface (decision 57): no page-level
       toggle — each <nuri-demo> scopes its OWN theme/accent locally. -->
  <script>
    document.documentElement.dataset.theme = 'light';
    document.documentElement.dataset.neutral = 'cream';
    document.documentElement.dataset.accent = 'neutral';
  </script>

  <!-- Token cake + base reset + type scale (the foundation · the web projection's generated output). -->
  <link rel="stylesheet" href="../../prototype/generated/styles/tokens-primitive.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/tokens-semantic.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/shell.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/typography.css" />

  <!-- Active components — the tab-bar/topbar/button/icon-button recipes' primitives + the shared demo layer. -->
  <link rel="stylesheet" href="../../prototype/primitives/icon.css" />
  <link rel="stylesheet" href="../../prototype/primitives/pressable.css" />
  <link rel="stylesheet" href="../../prototype/styles/typography.css" />
  <link rel="stylesheet" href="../../prototype/styles/stack.css" />
  <link rel="stylesheet" href="../../prototype/styles/box.css" />
  <link rel="stylesheet" href="../../prototype/styles/palette.css" />
  <link rel="stylesheet" href="../../prototype/styles/interactive.css" />
  <link rel="stylesheet" href="../../prototype/factory/reset.css" />
  <link rel="stylesheet" href="../../prototype/demo/control.css" />
  <link rel="stylesheet" href="../../prototype/demo/demo.css" />
  <!-- The playground area shell (topbar + the board scroll container). -->
  <link rel="stylesheet" href="../lib/shell.css" />

  <!-- The standalone playground's NuriState seed (theme + spec-derived accent). -->
  <script src="../../prototype/demo/available.js" type="module"></script>

  <!-- Shell first (mirrors the DS order): it reparents the authored <nuri-demo>
       panels into its built <main>, so it must run before the demos compose. -->
  <script src="../lib/shell.js" defer></script>

  <!-- Custom element scripts MUST be deferred so connectedCallback fires AFTER body
       parsing. The recipes self-import their primitives (idempotent define-guards). -->
  <script src="../../prototype/demo/control.js" defer></script>
  <script src="../../prototype/primitives/scope.js" defer></script>
  <script src="../../prototype/primitives/icon.js" type="module"></script>
  <script src="../../prototype/primitives/typography.js" defer></script>
  <script src="../../prototype/primitives/stack.js" defer></script>
  <script src="../../prototype/recipes/button.js" type="module"></script>
  <script src="../../prototype/recipes/icon-button.js" type="module"></script>
  <script src="../../prototype/recipes/topbar.js" type="module"></script>
  <script src="../../prototype/recipes/tab-bar.js" type="module"></script>
  <script src="../../prototype/demo/demo.js" defer></script>

  <style>
    /* Page-local CHROME tweaks ONLY (the board row). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }
    /* The screen frame: a column that fills the device height so the tab-bar sits
       at the BOTTOM edge (the navigator-chrome position · a SIBLING of the body). */
    .screen { min-block-size: 560px; }
    .screen__body { flex: 1; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Tab bar">

  <!-- WALLET screen · the card destination is active. topbar + balance + two
       actions, with the bottom bar pinned below — a real screen from the pieces. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="wallet">
    <template>
      <nuri-stack class="screen" direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon-button icon="apple" variant="ghost" aria-label="Menu"></nuri-icon-button>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-typography size="md" emphasis>Wallet</nuri-typography>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="card" variant="soft" aria-label="Cards"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-stack class="screen__body" direction="column" align="center" justify="center" gap="lg" fill>
          <nuri-stack direction="column" align="center" justify="center" gap="xs">
            <nuri-typography size="sm">Total balance</nuri-typography>
            <nuri-typography size="3xl" emphasis>€ 25.87</nuri-typography>
          </nuri-stack>
          <nuri-stack direction="row" align="center" justify="center" gap="sm">
            <nuri-button size="md" variant="solid">Send</nuri-button>
            <nuri-button size="md" variant="soft">Receive</nuri-button>
          </nuri-stack>
        </nuri-stack>

        <nuri-tab-bar>
          <nuri-tab icon="card" label="Wallet" selected></nuri-tab>
          <nuri-tab icon="bitcoin" label="Coin"></nuri-tab>
          <nuri-tab icon="euro" label="Cash"></nuri-tab>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- COIN screen · the bitcoin destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="coin">
    <template>
      <nuri-stack class="screen" direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon-button icon="apple" variant="ghost" aria-label="Menu"></nuri-icon-button>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-typography size="md" emphasis>Coin</nuri-typography>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="bitcoin" variant="soft" aria-label="Markets"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-stack class="screen__body" direction="column" align="center" justify="center" gap="lg" fill>
          <nuri-stack direction="column" align="center" justify="center" gap="xs">
            <nuri-typography size="sm">Bitcoin holdings</nuri-typography>
            <nuri-typography size="3xl" emphasis>₿ 0.0413</nuri-typography>
          </nuri-stack>
          <nuri-stack direction="row" align="center" justify="center" gap="sm">
            <nuri-button size="md" variant="solid">Buy</nuri-button>
            <nuri-button size="md" variant="soft">Sell</nuri-button>
          </nuri-stack>
        </nuri-stack>

        <nuri-tab-bar>
          <nuri-tab icon="card" label="Wallet"></nuri-tab>
          <nuri-tab icon="bitcoin" label="Coin" selected></nuri-tab>
          <nuri-tab icon="euro" label="Cash"></nuri-tab>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- CASH screen · the euro destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="cash">
    <template>
      <nuri-stack class="screen" direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon-button icon="apple" variant="ghost" aria-label="Menu"></nuri-icon-button>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-typography size="md" emphasis>Cash</nuri-typography>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="euro" variant="soft" aria-label="Transfers"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-stack class="screen__body" direction="column" align="center" justify="center" gap="lg" fill>
          <nuri-stack direction="column" align="center" justify="center" gap="xs">
            <nuri-typography size="sm">Available cash</nuri-typography>
            <nuri-typography size="3xl" emphasis>€ 1 240.00</nuri-typography>
          </nuri-stack>
          <nuri-stack direction="row" align="center" justify="center" gap="sm">
            <nuri-button size="md" variant="solid">Add money</nuri-button>
            <nuri-button size="md" variant="soft">Withdraw</nuri-button>
          </nuri-stack>
        </nuri-stack>

        <nuri-tab-bar>
          <nuri-tab icon="card" label="Wallet"></nuri-tab>
          <nuri-tab icon="bitcoin" label="Coin"></nuri-tab>
          <nuri-tab icon="euro" label="Cash" selected></nuri-tab>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- ISOLATION · the bar's states side by side: ONE selected (text-primary) vs the
       others unselected (the receded border-strong) — the colour-only treatment
       (no icon weights · decision 38). pressScale on tap (no bg change). -->
  <nuri-demo layout="board" controls="device,theme,accent" label="states">
    <template>
      <nuri-stack direction="column" align="stretch" justify="center" gap="md" fill>
        <nuri-tab-bar>
          <nuri-tab icon="card" label="Wallet" selected></nuri-tab>
          <nuri-tab icon="bitcoin" label="Coin"></nuri-tab>
          <nuri-tab icon="euro" label="Cash"></nuri-tab>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
