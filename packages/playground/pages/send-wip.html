  <!-- OUTSIDE THE DS · page-local CSS for the EXPERIMENT boards only. Not a pattern to copy. -->
  <style data-outside-ds>
    /* EXPERIMENT · the amount From→To pair (2026-10-28). Rows smaller than list-action
       (48px avatar, two lines, full padding), to find the size we want before any DS
       request. DS tokens only; every row is at least 48px tall (size.lg) for touch. */
    .xpair { display: flex; flex-direction: column; border: 1px solid var(--nuri-border-subtle);
             border-radius: var(--nuri-radius-lg); overflow: hidden; }
    .xrow { appearance: none; border: 0; margin: 0; background: transparent; font: inherit; color: inherit;
            text-align: start; width: 100%; box-sizing: border-box; min-height: var(--nuri-size-lg);
            display: flex; align-items: center; gap: var(--nuri-space-md);
            padding: var(--nuri-space-sm) var(--nuri-space-md); cursor: pointer; }
    .xrow + .xrow { border-top: 1px solid var(--nuri-border-subtle); }
    .xrow:active { background: var(--nuri-bg-pressed); }
    .xgrow { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .xkey { flex: none; width: 3em; }
    /* a 36px (size.md) avatar: icon-avatar only has 24 and 48 */
    .xav { position: relative; flex: none; width: var(--nuri-size-md); height: var(--nuri-size-md);
           border-radius: var(--nuri-radius-full); background: var(--nuri-bg-strong);
           color: var(--nuri-text-primary); font-family: var(--nuri-font-family-sans);
           font-size: var(--nuri-type-sm-size); display: inline-flex; align-items: center; justify-content: center; }
    .xav img { width: 100%; height: 100%; border-radius: var(--nuri-radius-full); }
    /* the accessory scaled to the 36px avatar: 11px glyph + 2px padding, 2px ring */
    .xbadge { position: absolute; right: -3px; bottom: -3px; padding: 2px; border-radius: var(--nuri-radius-full);
              background: var(--nuri-bg-inverse); color: var(--nuri-text-on-inverse);
              box-shadow: 0 0 0 2px var(--nuri-bg-canvas); display: inline-flex; }
    .xbadge nuri-icon { width: 11px; height: 11px; }
    .xbadge nuri-icon svg { width: 100%; height: 100%; }
    [data-xchev] { flex: none; color: var(--nuri-border-strong); }
  </style>
</head>

  ═══════════════════════════════════════════════════════════════

  ═══════════════════════════════════════════════════════════════

  Boards that are not finished yet, kept apart from send.html (the finished
  recipient step). Nothing here is decided: some boards are explorations
  under review, some are drafts from the 2026-10-22 brief.

  their naming states · the Bitcoin wallet form (N4, five states) · amount ·
  review, including the "save as contact" switch variants (under review: the
  switch only fits where a name already exists).
  From send-bank.html (retired 2026-10-28): the IBAN boards, still on the
  older S1 field model · holder name · amount, card short · review, two legs
  · locked row · activate.
  New 2026-10-28: amount for a Nuri user in Euro (default, Euro short, a
  Coinbase version, three experiments on the size of the From→To pair, and
  the operator's mock with and without four changes). The page opens with the
  variants of send.html "send · amount": nine recipients and two states
  (empty, in bitcoin),

  no inline styles; every slightly-off composition is in the MISFIT LOG at
