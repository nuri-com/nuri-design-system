<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Nuri · Playground · Pressable Item</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />

  <script>
    document.documentElement.dataset.theme = 'light';
    document.documentElement.dataset.neutral = 'cream';
    document.documentElement.dataset.accent = 'neutral';
  </script>

  <link rel="stylesheet" href="../../prototype/generated/styles/tokens-primitive.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/tokens-semantic.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/shell.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/typography.css" />

  <link rel="stylesheet" href="../../prototype/primitives/icon.css" />
  <link rel="stylesheet" href="../../prototype/primitives/pressable.css" />
  <link rel="stylesheet" href="../../prototype/primitives/separator.css" />
  <link rel="stylesheet" href="../../prototype/styles/typography.css" />
  <link rel="stylesheet" href="../../prototype/styles/stack.css" />
  <link rel="stylesheet" href="../../prototype/styles/box.css" />
  <link rel="stylesheet" href="../../prototype/styles/palette.css" />
  <link rel="stylesheet" href="../../prototype/styles/interactive.css" />
  <link rel="stylesheet" href="../../prototype/factory/reset.css" />
  <link rel="stylesheet" href="../../prototype/demo/control.css" />
  <link rel="stylesheet" href="../../prototype/demo/demo.css" />
  <link rel="stylesheet" href="../lib/shell.css" />

  <script src="../../prototype/demo/available.js" type="module"></script>
  <script src="../lib/shell.js" defer></script>
  <script src="../../prototype/demo/control.js" defer></script>
  <script src="../../prototype/primitives/scope.js" defer></script>
  <script src="../../prototype/primitives/icon.js" type="module"></script>
  <script src="../../prototype/primitives/typography.js" defer></script>
  <script src="../../prototype/primitives/stack.js" defer></script>
  <script src="../../prototype/primitives/view.js" type="module"></script>
  <script src="../../prototype/primitives/separator.js" defer></script>
  <script src="../../prototype/recipes/pressable-item.js" type="module"></script>
  <script src="../../prototype/recipes/topbar.js" type="module"></script>
  <script src="../../prototype/demo/demo.js" defer></script>

</head>
<body>

<nuri-playground-shell doc="Pressable Item">

  <nuri-demo layout="board" controls="device,theme,accent" label="navigation">
    <template>
      <nuri-view direction="column" align="stretch" justify="center" gap="none" fill padding-x="sm">
        <nuri-pressable-item aria-label="Bank account">
          <nuri-pressable-item-leading-avatar name="bank"></nuri-pressable-item-leading-avatar>
          <nuri-pressable-item-text>Bank account</nuri-pressable-item-text>
          <nuri-pressable-item-trail-icon name="chevron-right"></nuri-pressable-item-trail-icon>
        </nuri-pressable-item>
        <nuri-view padding-x="md"><nuri-separator y-space="sm"></nuri-separator></nuri-view>
        <nuri-pressable-item aria-label="Credit card">
          <nuri-pressable-item-leading-avatar name="card"></nuri-pressable-item-leading-avatar>
          <nuri-pressable-item-text>Credit card</nuri-pressable-item-text>
          <nuri-pressable-item-trail-icon name="chevron-right"></nuri-pressable-item-trail-icon>
        </nuri-pressable-item>
      </nuri-view>
    </template>
  </nuri-demo>

  <nuri-demo layout="board" controls="device,theme,accent" label="transactions">
    <template>
      <nuri-view direction="column" align="stretch" justify="center" gap="none" fill padding-x="sm">
        <nuri-pressable-item aria-label="To Emin Mahrt, minus 12 euros">
          <nuri-pressable-item-leading-avatar name="arrow-up"></nuri-pressable-item-leading-avatar>
          <nuri-pressable-item-text>To Emin Mahrt</nuri-pressable-item-text>
          <nuri-pressable-item-text-muted>Sent • Wed, 16 May</nuri-pressable-item-text-muted>
          <nuri-pressable-item-trailing-text>- 12.00 €</nuri-pressable-item-trailing-text>
          <nuri-pressable-item-trailing-text-muted>3433 Sats</nuri-pressable-item-trailing-text-muted>
        </nuri-pressable-item>
        <nuri-view padding-x="md"><nuri-separator y-space="sm"></nuri-separator></nuri-view>
        <nuri-pressable-item aria-label="From Apple Pay, 12 euros">
          <nuri-pressable-item-leading-avatar name="transfer-horizontal"></nuri-pressable-item-leading-avatar>
          <nuri-pressable-item-text>From Apple Pay</nuri-pressable-item-text>
          <nuri-pressable-item-text-muted>Convert • Wed, 16 May</nuri-pressable-item-text-muted>
          <nuri-pressable-item-trailing-text>12.00 €</nuri-pressable-item-trailing-text>
          <nuri-pressable-item-trailing-text-muted>3433 Sats</nuri-pressable-item-trailing-text-muted>
        </nuri-pressable-item>
      </nuri-view>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
