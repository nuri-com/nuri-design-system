<!--
  ═══════════════════════════════════════════════════════════════
  HOME (updated 2026-11-21)
  ═══════════════════════════════════════════════════════════════

  The home as it stands, promoted from home-wip.html ("wallet block · round
  actions 2 · space below"): The operator, 21 Nov, "lasciamolo così; aggiorna cosa
  abbiamo in home, promuovi questa versione; fai tutti gli stati
  necessari". The explorations stay in home-wip.html (the earlier home 1 ·
  flex boards are there, under "superseded"); the register is nuri-expo
  docs/research/home-decisions.md.

  The home, top to bottom: scan; the history icon, left of the profile (a
  spinner while a payment is in progress); the total; Add money (the only
  solid action), Send, Receive, Exchange; the wallet block (Euro, Bitcoin,
  Lightning when there is one); the Bank & card card. Four equal spaces
  share the spare height, so the home breathes on tall screens and stays
  without scrolling on the iPhone SE, Lightning included.

  States: the home; with Lightning; a payment in progress; Exchange open
  (operation.html board 10's sheet); Bank & card not active; the identity
  check not finished. Then the page the Bank & card
  card opens. What the spinner opens stays in home-wip.html ("home ·
  payment in progress, open"). Not drawn: "in review" (verification
  sent, waiting), the empty home (onboarding's job).

  Pure DS composition (decision 57), no page CSS. The static balance rows
  are composed from views (the DS has no static list row): see the misfit
  log in home-wip.html.
  ═══════════════════════════════════════════════════════════════
-->

                    </nuri-view>

                    <nuri-view direction="row" justify="between" align="center">
                      <nuri-view direction="row" gap="sm" align="center">
                        <nuri-icon-avatar size="sm" source="../assets/logos/bitcoin.svg"></nuri-icon-avatar>
                        <nuri-typography size="md" emphasis>Bitcoin</nuri-typography>
                        <nuri-typography size="sm" muted>₿ 402 990</nuri-typography>
                      </nuri-view>
                      <nuri-typography size="md" emphasis>€ 380.00</nuri-typography>
                    </nuri-view>

                </nuri-view>
            </nuri-view>
            <nuri-view padding-x="lg">

                  </nuri-view>

              </nuri-view>
            </nuri-view>
