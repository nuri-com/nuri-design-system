<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Screens</title>
  <link rel="stylesheet" href="../generated/playground.css" />
  <script src="../generated/boot.js" type="module"></script>
  <style>
    /* Page-local CHROME tweaks ONLY (the board row). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Screens">

  <!-- BITCOIN screen · the bitcoin wallet destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="bitcoin">
    <template>
      <nuri-screen safe-area>
        <nuri-topbar surface="transparent">
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="list-bullets" variant="soft" aria-label="Activity"></nuri-icon-button>
            <nuri-icon-button icon="headphones" variant="soft" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-scroll>
          <nuri-view direction="column" align="stretch" justify="start" gap="lg" padding-x="lg" padding-y="md" fill>
            <nuri-view aspect-ratio="card" radius="lg"></nuri-view>
            <nuri-typography size="3xl" align="center">₿ 0.0413</nuri-typography>
            <nuri-view direction="row" align="center" gap="sm" distribute="even">
              <nuri-button size="lg" variant="soft">Receive</nuri-button>
              <nuri-button size="lg" variant="solid" accent="orange">Send</nuri-button>
            </nuri-view>
          </nuri-view>
        </nuri-scroll>

        <nuri-tab-bar>
          <nuri-tab-bar-item selected aria-label="Bitcoin wallet">
            <nuri-tab-bar-item-icon name="bitcoin-wallet"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 36.50</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
          <nuri-tab-bar-item aria-label="Bank account">
            <nuri-tab-bar-item-icon name="bank"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 18.90</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
          <nuri-tab-bar-item aria-label="Euro wallet">
            <nuri-tab-bar-item-icon name="euro-wallet"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 25.70</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-screen>
    </template>
  </nuri-demo>

  <!-- BANK screen · the bank destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="bank">

      <nuri-screen safe-area>

        <nuri-scroll>

            <nuri-typography size="3xl" align="center">€ 25.87</nuri-typography>
            <nuri-view direction="row" align="center" gap="sm" distribute="even">
              <nuri-button size="lg" variant="soft">Details</nuri-button>
              <nuri-button size="lg" variant="solid" accent="lilac">Send</nuri-button>
            </nuri-view>
          </nuri-view>
        </nuri-scroll>

        <nuri-tab-bar>
          <nuri-tab-bar-item aria-label="Bitcoin wallet">

            <nuri-tab-bar-item-label>€ 36.50</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
          <nuri-tab-bar-item selected aria-label="Bank account">

            <nuri-tab-bar-item-label>€ 18.90</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
          <nuri-tab-bar-item aria-label="Euro wallet">
            <nuri-tab-bar-item-icon name="euro-wallet"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 25.70</nuri-tab-bar-item-label>

        </nuri-tab-bar>
      </nuri-screen>

  </nuri-demo>

  <!-- EURO screen · the euro wallet destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="euro">
    <template>
      <nuri-screen safe-area>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>

            <nuri-typography size="3xl" align="center">€ 1 240.00</nuri-typography>
            <nuri-view direction="row" align="center" gap="sm" distribute="even">
              <nuri-button size="lg" variant="soft">Receive</nuri-button>
              <nuri-button size="lg" variant="solid" accent="lilac">Send</nuri-button>
            </nuri-view>
          </nuri-view>
        </nuri-scroll>

        <nuri-tab-bar>
          <nuri-tab-bar-item aria-label="Bitcoin wallet">
            <nuri-tab-bar-item-icon name="bitcoin-wallet"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 36.50</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
          <nuri-tab-bar-item aria-label="Bank account">
            <nuri-tab-bar-item-icon name="bank"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 18.90</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
          <nuri-tab-bar-item selected aria-label="Euro wallet">
            <nuri-tab-bar-item-icon name="euro-wallet"></nuri-tab-bar-item-icon>
            <nuri-tab-bar-item-label>€ 25.70</nuri-tab-bar-item-label>
          </nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-screen>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
