<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuri · Playground · Screens</title>
  <link rel="stylesheet" href="../generated/playground.css" />
  <script src="../generated/boot.js" type="module"></script>
  <style>
    /* Page-local CHROME tweaks ONLY (the board row). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Screens">

  <!-- BITCOIN screen · the bitcoin wallet destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="bitcoin">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar surface="transparent">
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="list-bullets" variant="soft" aria-label="Activity"></nuri-icon-button>
            <nuri-icon-button icon="headphones" variant="soft" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-view direction="column" align="stretch" justify="start" gap="lg" padding-x="lg" padding-y="md" fill>
          <nuri-view aspect-ratio="card" radius="lg"></nuri-view>
          <nuri-typography size="3xl" align="center">₿ 0.0413</nuri-typography>
          <nuri-view direction="row" align="center" gap="sm" distribute="even">
            <nuri-button size="lg" variant="soft">Receive</nuri-button>
            <nuri-button size="lg" variant="solid" accent="orange">Send</nuri-button>
          </nuri-view>
        </nuri-view>

        <nuri-tab-bar>
          <nuri-tab-bar-item icon="bitcoin-wallet" label="€ 36.50" selected></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="bank" label="€ 18.90"></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="euro-wallet" label="€ 25.70"></nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- BANK screen · the bank destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="bank">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="list-bullets" variant="soft" aria-label="Activity"></nuri-icon-button>
            <nuri-icon-button icon="headphones" variant="soft" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-view direction="column" align="stretch" justify="start" gap="lg" padding-x="lg" padding-y="md" fill>
          <nuri-view aspect-ratio="card" radius="lg" variant="soft"></nuri-view>
          <nuri-typography size="3xl" align="center">€ 25.87</nuri-typography>
          <nuri-view direction="row" align="center" gap="sm" distribute="even">
            <nuri-button size="lg" variant="soft">Details</nuri-button>
            <nuri-button size="lg" variant="solid" accent="lilac">Send</nuri-button>
          </nuri-view>
        </nuri-view>

        <nuri-tab-bar>
          <nuri-tab-bar-item icon="bitcoin-wallet" label="€ 36.50"></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="bank" label="€ 18.90" selected></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="euro-wallet" label="€ 25.70"></nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- EURO screen · the euro wallet destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="euro">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="list-bullets" variant="soft" aria-label="Activity"></nuri-icon-button>
            <nuri-icon-button icon="headphones" variant="soft" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-view direction="column" align="stretch" justify="start" gap="lg" padding-x="lg" padding-y="md" fill>
          <nuri-view aspect-ratio="card" radius="lg"></nuri-view>
          <nuri-typography size="3xl" align="center">€ 1 240.00</nuri-typography>
          <nuri-view direction="row" align="center" gap="sm" distribute="even">
            <nuri-button size="lg" variant="soft">Receive</nuri-button>
            <nuri-button size="lg" variant="solid" accent="lilac">Send</nuri-button>
          </nuri-view>
        </nuri-view>

        <nuri-tab-bar>
          <nuri-tab-bar-item icon="bitcoin-wallet" label="€ 36.50"></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="bank" label="€ 18.90"></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="euro-wallet" label="€ 25.70" selected></nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- ACTIVITY screen · proves screen-local Dock + Scroll dock inset. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="activity">
    <template>
      <nuri-screen>
        <nuri-dock edge="top">
          <nuri-topbar surface="transparent">
            <nuri-icon-button icon="download" variant="soft" aria-label="Download"></nuri-icon-button>
            <nuri-icon-button icon="cross" variant="soft" aria-label="Close"></nuri-icon-button>
          </nuri-topbar>
        </nuri-dock>

        <nuri-scroll inset-top="dock" inset-bottom="dock">
          <nuri-view direction="column" align="stretch" justify="start" gap="md" padding-y="md">
            <nuri-list>
              <nuri-list-action variant="soft" aria-label="Bank account">
                <nuri-list-action-leading-avatar name="bank"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Bank account</nuri-list-action-text>
                <nuri-list-action-text-muted>€ 18.90 available</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="solid" accent="orange" aria-label="Sent bitcoin">
                <nuri-list-action-leading-avatar name="arrow-up"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Sent bitcoin</nuri-list-action-text>
                <nuri-list-action-text-muted>Today, 09:41</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>- € 8.20</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>0.00009 BTC</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="outline" aria-label="Euro wallet">
                <nuri-list-action-leading-avatar name="euro-wallet"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Euro wallet</nuri-list-action-text>
                <nuri-list-action-text-muted>€ 25.70 balance</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="soft" aria-label="Card top up">
                <nuri-list-action-leading-avatar name="card"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Card top up</nuri-list-action-text>
                <nuri-list-action-text-muted>Yesterday</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>+ € 40.00</nuri-list-action-trailing-text>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="solid" aria-label="Received bitcoin">
                <nuri-list-action-leading-avatar name="arrow-down"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Received bitcoin</nuri-list-action-text>
                <nuri-list-action-text-muted>Mon, 14:12</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>+ € 16.42</nuri-list-action-trailing-text>
                <nuri-list-action-trailing-text-muted>0.00018 BTC</nuri-list-action-trailing-text-muted>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="outline" aria-label="Apple Pay">
                <nuri-list-action-leading-avatar name="apple"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Apple Pay</nuri-list-action-text>
                <nuri-list-action-text-muted>Connected</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="soft" aria-label="Convert">
                <nuri-list-action-leading-avatar name="transfer-horizontal"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Convert</nuri-list-action-text>
                <nuri-list-action-text-muted>BTC to EUR</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="outline" aria-label="Monthly statement">
                <nuri-list-action-leading-avatar name="list-bullets"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Monthly statement</nuri-list-action-text>
                <nuri-list-action-text-muted>June 2026</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="soft" aria-label="Download receipt">
                <nuri-list-action-leading-avatar name="download"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Download receipt</nuri-list-action-text>
                <nuri-list-action-text-muted>PDF ready</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="outline" aria-label="Share payment link">
                <nuri-list-action-leading-avatar name="share"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Share payment link</nuri-list-action-text>
                <nuri-list-action-text-muted>Expires tomorrow</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="solid" accent="lilac" aria-label="QR scan">
                <nuri-list-action-leading-avatar name="qr-scan"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>QR scan</nuri-list-action-text>
                <nuri-list-action-text-muted>Received request</nuri-list-action-text-muted>
                <nuri-list-action-trailing-text>€ 12.00</nuri-list-action-trailing-text>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="outline" aria-label="Security check">
                <nuri-list-action-leading-avatar name="warning-circle"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Security check</nuri-list-action-text>
                <nuri-list-action-text-muted>Review device access</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
              <nuri-list-separator></nuri-list-separator>
              <nuri-list-action variant="soft" aria-label="Completed setup">
                <nuri-list-action-leading-avatar name="check-circle"></nuri-list-action-leading-avatar>
                <nuri-list-action-text>Completed setup</nuri-list-action-text>
                <nuri-list-action-text-muted>All checks passed</nuri-list-action-text-muted>
                <nuri-list-action-trail-icon name="chevron-right"></nuri-list-action-trail-icon>
              </nuri-list-action>
            </nuri-list>
          </nuri-view>
        </nuri-scroll>

        <nuri-dock edge="bottom">
          <nuri-tab-bar surface="transparent">
            <nuri-tab-bar-item icon="bitcoin-wallet" label="€ 36.50" selected></nuri-tab-bar-item>
            <nuri-tab-bar-item icon="bank" label="€ 18.90"></nuri-tab-bar-item>
            <nuri-tab-bar-item icon="euro-wallet" label="€ 25.70"></nuri-tab-bar-item>
          </nuri-tab-bar>
        </nuri-dock>
      </nuri-screen>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
