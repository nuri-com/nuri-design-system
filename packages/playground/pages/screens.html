<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Dev cache busting · see README.md "Dev cache caveat" for rationale. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Nuri · Playground · Screens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />

  <!--
    ═══════════════════════════════════════════════════════════════
    PLAYGROUND · DOCUMENT · SCREENS (product surfaces)
    ═══════════════════════════════════════════════════════════════
    Three product-like screens composed from the ACTIVE catalog pieces:
    topbar + balance + two Buttons + the tab-bar, one active destination
    each. Page-local CSS stays harness/chrome only; the screen bodies stay
    on DS primitives, generated recipes, and the shared demo layer.

    Composed from the ACTIVE set only — the tab-bar/topbar/button/icon-button
    recipes + the shared @nuri/prototype demo layer. ZERO import from @nuri/doc
    (the DAG stays playground → prototype → spec · decision 68).
    ═══════════════════════════════════════════════════════════════
  -->

  <!-- The playground is a FIXED light + cream surface (decision 57): no page-level
       toggle — each <nuri-demo> scopes its OWN theme/accent locally. -->
  <script>
    document.documentElement.dataset.theme = 'light';
    document.documentElement.dataset.neutral = 'cream';
    document.documentElement.dataset.accent = 'neutral';
  </script>

  <!-- Token cake + base reset + type scale (the foundation · the web projection's generated output). -->
  <link rel="stylesheet" href="../../prototype/generated/styles/tokens-primitive.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/tokens-semantic.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/shell.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/typography.css" />

  <!-- Active components — the screen recipes' primitives + the shared demo layer. -->
  <link rel="stylesheet" href="../../prototype/primitives/icon.css" />
  <link rel="stylesheet" href="../../prototype/primitives/pressable.css" />
  <link rel="stylesheet" href="../../prototype/styles/typography.css" />
  <link rel="stylesheet" href="../../prototype/styles/stack.css" />
  <link rel="stylesheet" href="../../prototype/styles/box.css" />
  <link rel="stylesheet" href="../../prototype/styles/palette.css" />
  <link rel="stylesheet" href="../../prototype/styles/interactive.css" />
  <link rel="stylesheet" href="../../prototype/factory/reset.css" />
  <link rel="stylesheet" href="../../prototype/demo/control.css" />
  <link rel="stylesheet" href="../../prototype/demo/demo.css" />
  <!-- The playground area shell (topbar + the board scroll container). -->
  <link rel="stylesheet" href="../lib/shell.css" />

  <!-- The standalone playground's NuriState seed (theme + spec-derived accent). -->
  <script src="../../prototype/demo/available.js" type="module"></script>

  <!-- Shell first (mirrors the DS order): it reparents the authored <nuri-demo>
       panels into its built <main>, so it must run before the demos compose. -->
  <script src="../lib/shell.js" defer></script>

  <!-- Custom element scripts MUST be deferred so connectedCallback fires AFTER body
       parsing. The recipes self-import their primitives (idempotent define-guards). -->
  <script src="../../prototype/demo/control.js" defer></script>
  <script src="../../prototype/primitives/scope.js" defer></script>
  <script src="../../prototype/primitives/icon.js" type="module"></script>
  <script src="../../prototype/primitives/typography.js" defer></script>
  <script src="../../prototype/primitives/stack.js" defer></script>
  <script src="../../prototype/primitives/view.js" type="module"></script>
  <script src="../../prototype/recipes/button.js" type="module"></script>
  <script src="../../prototype/recipes/icon-button.js" type="module"></script>
  <script src="../../prototype/recipes/topbar.js" type="module"></script>
  <script src="../../prototype/recipes/tab-bar.js" type="module"></script>
  <script src="../../prototype/demo/demo.js" defer></script>

  <style>
    /* Page-local CHROME tweaks ONLY (the board row). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Screens">

  <!-- BITCOIN screen · the bitcoin wallet destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="bitcoin">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="list-bullets" variant="soft" size="lg" aria-label="Activity"></nuri-icon-button>
            <nuri-icon-button icon="headphones" variant="soft" size="lg" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-view direction="column" align="stretch" justify="start" gap="lg" padding-x="lg" padding-y="md" fill>
          <nuri-view aspect-ratio="card" radius="lg"></nuri-view>
          <nuri-typography size="3xl" align="center">₿ 0.0413</nuri-typography>
          <nuri-view direction="row" align="center" gap="sm">
            <nuri-view fill="even"><nuri-button size="lg" variant="soft">Receive</nuri-button></nuri-view>
            <nuri-view fill="even"><nuri-button size="lg" variant="solid" accent="orange">Send</nuri-button></nuri-view>
          </nuri-view>
        </nuri-view>

        <nuri-tab-bar>
          <nuri-tab-bar-item icon="bitcoin-wallet" label="€ 36.50" selected></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="bank" label="€ 18.90"></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="euro-wallet" label="€ 25.70"></nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- BANK screen · the bank destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="bank">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="list-bullets" variant="soft" size="lg" aria-label="Activity"></nuri-icon-button>
            <nuri-icon-button icon="headphones" variant="soft" size="lg" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-view direction="column" align="stretch" justify="start" gap="lg" padding-x="lg" padding-y="md" fill>
          <nuri-view aspect-ratio="card" radius="lg" variant="soft"></nuri-view>
          <nuri-typography size="3xl" align="center">€ 25.87</nuri-typography>
          <nuri-view direction="row" align="center" gap="sm">
            <nuri-view fill="even"><nuri-button size="lg" variant="soft">Details</nuri-button></nuri-view>
            <nuri-view fill="even"><nuri-button size="lg" variant="solid" accent="lilac">Send</nuri-button></nuri-view>
          </nuri-view>
        </nuri-view>

        <nuri-tab-bar>
          <nuri-tab-bar-item icon="bitcoin-wallet" label="€ 36.50"></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="bank" label="€ 18.90" selected></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="euro-wallet" label="€ 25.70"></nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- EURO screen · the euro wallet destination is active. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="euro">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="none" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon name="nuri"></nuri-icon>
          </nuri-topbar-leading>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="list-bullets" variant="soft" size="lg" aria-label="Activity"></nuri-icon-button>
            <nuri-icon-button icon="headphones" variant="soft" size="lg" aria-label="Support"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>

        <nuri-view direction="column" align="stretch" justify="start" gap="lg" padding-x="lg" padding-y="md" fill>
          <nuri-view aspect-ratio="card" radius="lg" variant="soft"></nuri-view>
          <nuri-typography size="3xl" align="center">€ 1 240.00</nuri-typography>
          <nuri-view direction="row" align="center" gap="sm">
            <nuri-view fill="even"><nuri-button size="lg" variant="soft">Receive</nuri-button></nuri-view>
            <nuri-view fill="even"><nuri-button size="lg" variant="solid" accent="lilac">Send</nuri-button></nuri-view>
          </nuri-view>
        </nuri-view>

        <nuri-tab-bar>
          <nuri-tab-bar-item icon="bitcoin-wallet" label="€ 36.50"></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="bank" label="€ 18.90"></nuri-tab-bar-item>
          <nuri-tab-bar-item icon="euro-wallet" label="€ 25.70" selected></nuri-tab-bar-item>
        </nuri-tab-bar>
      </nuri-stack>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
