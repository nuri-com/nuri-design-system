<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Dev cache busting · see README.md "Dev cache caveat" for rationale. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Nuri · Playground · Topbar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />

  <!--
    ═══════════════════════════════════════════════════════════════
    PLAYGROUND · DOCUMENT · TOPBAR (the topbar-slots slice · the COMPOUND capability)
    ═══════════════════════════════════════════════════════════════
    The slot-based action bar — the catalog's first COMPOUND component. Three typed
    region sub-elements (<nuri-topbar-leading/center/trailing>) compose the bar; bare
    children default to trailing. Four boards: APP BAR (back · title · action) ·
    ACTIONS (menu · brand · two trailing actions) · DEFAULT SLOT (bare children →
    trailing) · TRUE CENTRE — the forcing function: a centre glyph stays dead-centre
    whether the edges are SYMMETRIC or ASYMMETRIC (a tiny leading icon vs a large
    trailing icon-button), because the leading/trailing edges carry `even` flex
    (1 1 0 · the equal-basis-0 split) and the centre is `flex:none`.

    Composed from the ACTIVE set only — the topbar + button + icon-button recipes +
    the shared @nuri/prototype demo layer. ZERO import from @nuri/doc (the DAG stays
    playground → prototype → spec · decision 68).
    ═══════════════════════════════════════════════════════════════
  -->

  <!-- The playground is a FIXED light + cream surface (decision 57): no page-level
       toggle — each <nuri-demo> scopes its OWN theme/accent locally. -->
  <script>
    document.documentElement.dataset.theme = 'light';
    document.documentElement.dataset.neutral = 'cream';
    document.documentElement.dataset.accent = 'neutral';
  </script>

  <!-- Token cake + base reset + type scale (the foundation · the web projection's generated output). -->
  <link rel="stylesheet" href="../../prototype/generated/styles/tokens-primitive.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/tokens-semantic.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/shell.css" />
  <link rel="stylesheet" href="../../prototype/generated/styles/typography.css" />

  <!-- Active components — the topbar/button/icon-button recipes' primitives + the shared demo layer. -->
  <link rel="stylesheet" href="../../prototype/primitives/icon.css" />
  <link rel="stylesheet" href="../../prototype/primitives/pressable.css" />
  <link rel="stylesheet" href="../../prototype/styles/typography.css" />
  <link rel="stylesheet" href="../../prototype/styles/stack.css" />
  <link rel="stylesheet" href="../../prototype/styles/box.css" />
  <link rel="stylesheet" href="../../prototype/styles/palette.css" />
  <link rel="stylesheet" href="../../prototype/styles/interactive.css" />
  <link rel="stylesheet" href="../../prototype/factory/reset.css" />
  <link rel="stylesheet" href="../../prototype/demo/control.css" />
  <link rel="stylesheet" href="../../prototype/demo/demo.css" />
  <!-- The playground area shell (topbar + the board scroll container). -->
  <link rel="stylesheet" href="../lib/shell.css" />

  <!-- The standalone playground's NuriState seed (theme + spec-derived accent). -->
  <script src="../../prototype/demo/available.js" type="module"></script>

  <!-- Shell first (mirrors the DS order): it reparents the authored <nuri-demo>
       panels into its built <main>, so it must run before the demos compose. -->
  <script src="../lib/shell.js" defer></script>

  <!-- Custom element scripts MUST be deferred so connectedCallback fires AFTER body
       parsing. The recipes self-import their primitives (idempotent define-guards). -->
  <script src="../../prototype/demo/control.js" defer></script>
  <script src="../../prototype/primitives/scope.js" defer></script>
  <script src="../../prototype/primitives/icon.js" type="module"></script>
  <script src="../../prototype/primitives/typography.js" defer></script>
  <script src="../../prototype/primitives/stack.js" defer></script>
  <script src="../../prototype/recipes/button.js" type="module"></script>
  <script src="../../prototype/recipes/icon-button.js" type="module"></script>
  <script src="../../prototype/recipes/topbar.js" type="module"></script>
  <script src="../../prototype/demo/demo.js" defer></script>

  <style>
    /* Page-local CHROME tweaks ONLY (the board row · the topbar). */
    .nuri-pg__scroll { gap: 0; }
    [data-pg-nav="ds"] { display: none; }
    [data-pg-nav="index"] { display: none; }
  </style>
</head>
<body>

<nuri-playground-shell doc="Topbar">

  <!-- app bar · the canonical pattern: a back affordance (leading) · a title
       (center) · an action (trailing). The title lands at the bar's true centre. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="app bar">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon-button icon="caret-left" variant="ghost" aria-label="Back"></nuri-icon-button>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-typography size="md" emphasis>Account</nuri-typography>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-icon-button icon="card" variant="soft" aria-label="Wallet"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- actions · a menu (leading) · a brand mark (center) · two trailing actions —
       the trailing region holds more than the leading, yet the brand stays centred. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="actions">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-topbar-leading>
            <nuri-icon-button icon="caret-left" variant="ghost" aria-label="Menu"></nuri-icon-button>
          </nuri-topbar-leading>
          <nuri-topbar-center>
            <nuri-typography size="md" emphasis>Nuri</nuri-typography>
          </nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-stack direction="row" align="center" gap="xs">
              <nuri-button size="sm" variant="ghost">Skip</nuri-button>
              <nuri-button size="sm" variant="solid">Next</nuri-button>
            </nuri-stack>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- default slot · BARE children of <nuri-topbar> (no region wrapper) collect into
       the trailing region — the "just actions" case. -->
  <nuri-demo layout="board" controls="device,theme,accent" label="default slot">
    <template>
      <nuri-stack direction="column" align="stretch" justify="start" gap="md" fill>
        <nuri-topbar>
          <nuri-button size="sm" variant="soft">Done</nuri-button>
        </nuri-topbar>
      </nuri-stack>
    </template>
  </nuri-demo>

  <!-- TRUE CENTRE · the forcing function. Two bars share an identical centre glyph
       (bitcoin). TOP bar: SYMMETRIC edges (a small icon each side). BOTTOM bar:
       ASYMMETRIC edges (a tiny leading icon vs a LARGE trailing icon-button). The
       two centre glyphs align on the SAME vertical line — proof that the asymmetric
       edge does not shove the centre (the `even`-flex edges split the leftover row
       equally · the centre is dead-centre regardless). -->
  <nuri-demo layout="board" controls="device,theme,accent" label="true centre">
    <template>
      <nuri-stack direction="column" align="stretch" justify="center" gap="lg" fill>
        <nuri-topbar>
          <nuri-topbar-leading><nuri-icon name="caret-left"></nuri-icon></nuri-topbar-leading>
          <nuri-topbar-center><nuri-icon name="bitcoin"></nuri-icon></nuri-topbar-center>
          <nuri-topbar-trailing><nuri-icon name="card"></nuri-icon></nuri-topbar-trailing>
        </nuri-topbar>
        <nuri-topbar>
          <nuri-topbar-leading><nuri-icon name="caret-left"></nuri-icon></nuri-topbar-leading>
          <nuri-topbar-center><nuri-icon name="bitcoin"></nuri-icon></nuri-topbar-center>
          <nuri-topbar-trailing>
            <nuri-icon-button size="lg" variant="solid" icon="apple" aria-label="Pay"></nuri-icon-button>
          </nuri-topbar-trailing>
        </nuri-topbar>
      </nuri-stack>
    </template>
  </nuri-demo>

</nuri-playground-shell>

</body>
</html>
