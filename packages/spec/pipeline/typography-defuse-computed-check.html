<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuri · N+45 · typography de-fusion computed-style equivalence (decision 77)</title>
<!--
  THE COMPUTED-STYLE ANCHOR (N+45 · decision 77 · the size×emphasis de-fusion).

  Companion to the node harness (pipeline/typography-cascade.test.js). That proves
  STRUCTURAL ≡ + the de-fused rules resolve to the restated oracle — but a node
  parser CANNOT model the CSS cascade. The de-fusion's load-bearing claim is exactly
  a cascade fact: [data-type-style="{size}"] and [data-type-emphasis] are EQUAL
  specificity (0,1,0) and BOTH set font-weight, so SOURCE ORDER decides — the
  emphasis rule, emitted last, wins. Only a real engine resolves that. This page is
  THE proof the de-fused realization renders identically to the old fused scale.

  It loads the live type-scale CSS (styles/tokens-primitive.css + styles/typography.css)
  and the real <nuri-typography> element (prototype/primitives/typography.js), builds
  one probe per (size × {regular, emphasis}) via the ELEMENT (size/emphasis attrs →
  the element's #sync sets data-type-style / data-type-emphasis → the CSS dispatches),
  and reads getComputedStyle — the actual rendered fontSize · lineHeight ·
  letterSpacing · fontWeight.

  COMPUTED-EQUIVALENCE (the gate · the values are FROZEN): every cell must equal the
  independent design oracle — the SAME composite the old fused .nuri-type-{step} /
  --em utilities rendered. emphasis swaps ONLY the weight (400→600); the metrics never
  move. A visual change would be a regression.

  Oracle (the 16px root · px = rem×16 · lineHeight = px×ratio · letterSpacing = px×em):
    xs  13 / 17.94 / 0      sm 15 / 19.95 / -0.15   md 17 / 21.93 / -0.34
    lg  22 / 27.94 / -0.33  xl 30 / 36    / -0.45   3xl 57 / 67.83 / -1.14
    weight: regular 400 · emphasis 600 (uniform · operator-locked)

  Served by the repo-root http-server (the preview tooling); paths are relative to
  this page. Run via the preview tooling, then read window.__parity. NOT a CI gate
  (the node CI has no browser) — the node harness is the gate; this is the
  session-time gold-standard confirmation.
-->
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 15px; } #summary { font-size: 14px; font-weight: 700; padding: 8px 0; }
  .ok { color: #137333; } .bad { color: #c5221f; font-weight: 700; }
  table { border-collapse: collapse; margin-top: 8px; } td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: left; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Nuri · N+45 · typography de-fusion · computed-style equivalence (decision 77)</h1>
<div id="summary">running…</div>
<div id="stage" aria-hidden="true" style="position:absolute; visibility:hidden;"></div>
<div id="report"></div>

<script>
// The independent design oracle: per size, the px metrics at the 16px root. emphasis
// swaps ONLY the weight. NOT read from the CSS — if a value here disagrees, one is wrong.
const SIZES = {
  xs:    { px: 13, ratio: 1.38, em: 0      },
  sm:    { px: 15, ratio: 1.33, em: -0.01  },
  md:    { px: 17, ratio: 1.29, em: -0.02  },
  lg:    { px: 22, ratio: 1.27, em: -0.015 },
  xl:    { px: 30, ratio: 1.20, em: -0.015 },
  '3xl': { px: 57, ratio: 1.19, em: -0.02  },
};
const EPS = 0.05; // sub-pixel rounding tolerance

// One cell per (size × {regular, emphasis}) — 12 probes.
const CELLS = [];
for (const [size, o] of Object.entries(SIZES)) {
  for (const emphasis of [false, true]) {
    CELLS.push({
      size, emphasis,
      expect: {
        fontSize: o.px,
        lineHeight: Math.round(o.px * o.ratio * 1000) / 1000,
        letterSpacing: Math.round(o.px * o.em * 1000) / 1000,
        fontWeight: emphasis ? 600 : 400,
      },
    });
  }
}

function buildNodes() {
  const stage = document.getElementById('stage');
  stage.textContent = '';
  return CELLS.map((cell) => {
    // the REAL element path: size/emphasis attrs → #sync → data-type-style / data-type-emphasis.
    const el = document.createElement('nuri-typography');
    el.setAttribute('size', cell.size);
    if (cell.emphasis) el.setAttribute('emphasis', '');
    el.textContent = 'Ag';
    stage.appendChild(el);
    return el;
  });
}

function readComputed(n) {
  const cs = getComputedStyle(n);
  const num = (v) => (v === 'normal' ? 0 : parseFloat(v));
  return {
    fontSize: num(cs.fontSize),
    lineHeight: num(cs.lineHeight),
    letterSpacing: num(cs.letterSpacing),
    fontWeight: parseInt(cs.fontWeight, 10),
  };
}

async function run() {
  const [tokP, typo] = await Promise.all([
    fetch('../styles/tokens-primitive.css').then((r) => r.text()),
    fetch('../styles/typography.css').then((r) => r.text()),
  ]);
  const style = document.createElement('style');
  style.textContent = tokP + '\n' + typo;
  document.head.appendChild(style);

  // load + await the real <nuri-typography> element (so #sync has set the data-attrs).
  await import('../../prototype/primitives/typography.js').catch(() => {
    // not a module — fall back to a classic script tag.
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = '../../prototype/primitives/typography.js';
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
  });
  await customElements.whenDefined('nuri-typography');

  const nodes = buildNodes();
  // a tick so connectedCallback/#sync has run + styles resolve.
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const got = nodes.map(readComputed);

  const fails = [];
  CELLS.forEach((cell, i) => {
    const g = got[i], e = cell.expect;
    const bad =
      Math.abs(g.fontSize - e.fontSize) > EPS ||
      Math.abs(g.lineHeight - e.lineHeight) > EPS ||
      Math.abs(g.letterSpacing - e.letterSpacing) > EPS ||
      g.fontWeight !== e.fontWeight;
    if (bad) fails.push({ cell: `${cell.size}${cell.emphasis ? ' · emphasis' : ''}`, got: g, expect: e });
  });

  const ok = fails.length === 0;
  window.__parity = { ok, cells: CELLS.length, failCount: fails.length, fails };

  const sum = document.getElementById('summary');
  sum.textContent = ok
    ? `PASS · ${CELLS.length} cells · the de-fused [data-type-style] + [data-type-emphasis] realization renders ≡ the old fused scale (computed-equivalent · decision 77)`
    : `FAIL · ${fails.length}/${CELLS.length} cells — a visual regression`;
  sum.className = ok ? 'ok' : 'bad';

  const cols = ['size', 'emphasis', 'fontSize', 'lineHeight', 'letterSpacing', 'fontWeight', '✓'];
  const rows = [cols.map((h) => `<th>${h}</th>`).join('')];
  CELLS.forEach((cell, i) => {
    const g = got[i], e = cell.expect;
    const cellOk = !fails.some((f) => f.cell === `${cell.size}${cell.emphasis ? ' · emphasis' : ''}`);
    const fmt = (got_, exp) => `${got_}${Math.abs(got_ - exp) > EPS ? ` ✗(${exp})` : ''}`;
    rows.push(
      `<tr><td>${cell.size}</td><td>${cell.emphasis ? 'yes' : '—'}</td>` +
      `<td class="n">${fmt(g.fontSize, e.fontSize)}</td>` +
      `<td class="n">${fmt(g.lineHeight, e.lineHeight)}</td>` +
      `<td class="n">${fmt(g.letterSpacing, e.letterSpacing)}</td>` +
      `<td class="n">${g.fontWeight === e.fontWeight ? g.fontWeight : `${g.fontWeight} ✗(${e.fontWeight})`}</td>` +
      `<td class="${cellOk ? 'ok' : 'bad'}">${cellOk ? '✓' : '✗'}</td></tr>`,
    );
  });
  document.getElementById('report').innerHTML = `<table>${rows.join('')}</table>`;
  return window.__parity;
}

window.__parityReady = run().catch((e) => {
  window.__parity = { ok: false, error: String((e && e.stack) || e) };
  const s = document.getElementById('summary');
  s.textContent = 'ERROR · ' + window.__parity.error;
  s.className = 'bad';
  return window.__parity;
});
</script>
</body>
</html>
