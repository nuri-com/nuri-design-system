<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuri · L3.1b · typography namespace CSS computed-style parity (gen vs hand · the muted scope + the display order)</title>
<!--
  THE COMPUTED-STYLE CONFIRMATION (the L3.1b reversible shadow · decision 70 / 67 / 73).

  Companion to the node harness (pipeline/typography-css.test.js). That proves STRUCTURAL
  ≡ (same selectors, same declarations) AND — the centerpiece — the ORDER-SOUNDNESS of the
  equal-specificity `display` pair (:not(:defined) before [align], asserted structurally +
  against the hand oracle). This page is the REAL-ENGINE gold-standard confirmation: a live
  browser resolving the two things the node parser cannot —
    1. the SCOPE-dependent muted colour: --nuri-text-muted is a theme-cascaded chrome token
       (light/dark · accent-INVARIANT), so its value depends on real [data-theme]/[data-
       accent] DOM ancestry. The node Guard C pins only the default neutral/light value
       (#666455); the dark value (#b7b4a4) is THIS page's job (the palette posture).
    2. the DISPLAY ORDER in a real cascade: the :not(:defined) skeleton (inline · (0,1,1))
       and the [align] rules (block · (0,1,1)) are EQUAL specificity, so a pre-upgrade
       aligned node resolves `display` by SOURCE ORDER.

  NATIVE — no proxy needed (the contrast with interactive's :active cell). `:not(:defined)`
  is a REAL pre-upgrade state: this page never calls customElements.define('nuri-typography',
  …), so EVERY <nuri-typography> here is genuinely un-upgraded (:not(:defined) matches) and
  the [align]/[data-muted] attribute selectors apply to it directly. So the EXACT generated
  bytes are exercised — the order resolution is the real engine's, not a synthesised one.

  THE anchors:
   · muted dark (cell 2): <nuri-typography data-muted> under a [data-theme=dark] ancestor
     resolves `color` to #b7b4a4 = rgb(183, 180, 164) — the scope-dependent value the node
     harness defers. The accent cell (3) proves text-muted is accent-INVARIANT (chrome).
   · ★ ORDER (cell 4): a pre-upgrade <nuri-typography align="start"> resolves `display` to
     block — the [align] rule (emitted LATER, at equal specificity) wins by SOURCE ORDER, so
     text-align takes effect even before typography.js upgrades the element. The contrast
     cell (7 · no align) resolves to inline — proving :not(:defined) genuinely sets inline,
     so the align `block` is a real source-order override, not an always-block default.

  Oracle (the restated design constants · not read from the CSS under test):
    text-muted light  #666455 = rgb(102, 100, 85)    [neutral-11-light = cream-11-light]
    text-muted dark   #b7b4a4 = rgb(183, 180, 164)   [neutral-11-dark  = cream-11-dark]
    align (pre-upgrade) → display: block · text-align: start | center | end
    no align (pre-upgrade) → display: inline   [the :not(:defined) skeleton]

  Served by the repo-root http-server (the preview tooling); paths are relative to this
  page. Run via the preview tooling, then read window.__parity. NOT a CI gate (the node CI
  has no browser) — the node harness is the gate (the order guard proves the same claim by
  CSS-cascade semantics); this is the session-time gold-standard confirmation.
-->
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 15px; } #summary { font-size: 14px; font-weight: 700; padding: 8px 0; }
  .ok { color: #137333; } .bad { color: #c5221f; font-weight: 700; }
  table { border-collapse: collapse; margin-top: 8px; } td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: left; }
  .sw { display: inline-block; width: 18px; height: 18px; border: 1px solid #888; vertical-align: middle; }
  /* the two toggleable typography stylesheets + the always-on tokens are injected at runtime */
</style>
<style id="tokens"></style>
<style id="gen"></style>
<style id="hand"></style>
</head>
<body>
<h1>Nuri · L3.1b · typography namespace CSS computed-style parity (generated vs hand · the muted scope + the display order)</h1>
<div id="summary">running…</div>
<div id="stage" aria-hidden="true" style="position:absolute; visibility:hidden;"></div>
<div id="report"></div>

<script>
// Each cell: nested ancestor scopes (outer→inner) + the probe's own attrs + the channels
// to read with their restated oracle value. The probe is ALWAYS a <nuri-typography> the
// page leaves undefined (so :not(:defined) matches · the native pre-upgrade state). Spans
// the muted scope variation (light · dark · lilac-invariant · the dec-anchored colour) and
// the display order (the equal-specificity :not(:defined)-vs-[align] resolution · cell 4 ★).
const CELLS = [
  // ── muted · the theme-cascaded chrome colour (scope-dependent · the palette posture) ──
  { id: 'muted · default (neutral/light)', ancestors: [], el: { 'data-muted': '' },
    oracle: { 'color': 'rgb(102, 100, 85)' } },
  { id: 'THE scope anchor · muted under [data-theme=dark] → cream-11-dark', anchor: true,
    ancestors: [{ 'data-theme': 'dark' }], el: { 'data-muted': '' },
    oracle: { 'color': 'rgb(183, 180, 164)' } },
  { id: 'muted under [data-accent=lilac] → unchanged (text-muted is accent-INVARIANT · chrome)',
    ancestors: [{ 'data-accent': 'lilac' }], el: { 'data-muted': '' },
    oracle: { 'color': 'rgb(102, 100, 85)' } },

  // ── align · the equal-specificity display order (pre-upgrade · :not(:defined) vs [align]) ──
  { id: '★ ORDER · pre-upgrade align="start" → display:block (align wins by source order over :not(:defined))',
    anchor: true, ancestors: [], el: { 'align': 'start' },
    oracle: { 'display': 'block', 'text-align': 'start' } },
  { id: 'align="center" (pre-upgrade) → display:block · text-align:center', ancestors: [], el: { 'align': 'center' },
    oracle: { 'display': 'block', 'text-align': 'center' } },
  { id: 'align="end" (pre-upgrade) → display:block · text-align:end', ancestors: [], el: { 'align': 'end' },
    oracle: { 'display': 'block', 'text-align': 'end' } },
  { id: 'CONTRAST · no align (pre-upgrade) → display:inline (the :not(:defined) skeleton · align genuinely overrides it)',
    ancestors: [], el: {}, oracle: { 'display': 'inline' } },
];

function buildNodes() {
  const stage = document.getElementById('stage');
  stage.textContent = '';
  return CELLS.map((cell) => {
    let mount = stage;
    for (const attrs of cell.ancestors) {
      const wrap = document.createElement('div');
      for (const [k, v] of Object.entries(attrs)) wrap.setAttribute(k, v);
      mount.appendChild(wrap);
      mount = wrap;
    }
    // the ELEMENT (the one place typography diverges from palette's .nuri- class). Left
    // UNDEFINED (the page never registers it) → :not(:defined) matches · the native pre-
    // upgrade state the order cell needs.
    const probe = document.createElement('nuri-typography');
    for (const [k, v] of Object.entries(cell.el)) probe.setAttribute(k, v);
    probe.textContent = 'Ag';
    mount.appendChild(probe);
    return probe;
  });
}

function measure(nodes) {
  return CELLS.map((cell, i) => {
    const cs = getComputedStyle(nodes[i]);
    const out = {};
    for (const p of Object.keys(cell.oracle)) out[p] = cs.getPropertyValue(p).trim();
    return out;
  });
}

async function run() {
  const files = await Promise.all([
    fetch('../styles/tokens-primitive.css').then((r) => r.text()),
    fetch('../styles/tokens-semantic.css').then((r) => r.text()),
    fetch('../lib/components/typography/typography.css').then((r) => r.text()), // LIVE (was build/css-preview · decision 74)
    fetch('../lib/components/typography/typography.css').then((r) => r.text()),
  ]);
  const [tokP, tokS, genTypo, handTypo] = files;
  document.getElementById('tokens').textContent = tokP + '\n' + tokS;
  const styleGen = document.getElementById('gen');
  const styleHand = document.getElementById('hand');
  styleGen.textContent = genTypo;
  styleHand.textContent = handTypo;

  const nodes = buildNodes();

  styleGen.disabled = false; styleHand.disabled = true;
  const g = measure(nodes);
  styleGen.disabled = true; styleHand.disabled = false;
  const h = measure(nodes);
  styleGen.disabled = false; // leave generated active for visual inspection

  const fails = [];
  let checks = 0;
  CELLS.forEach((cell, i) => {
    for (const p of Object.keys(cell.oracle)) {
      // EQUIVALENCE · generated computed === hand computed
      checks++;
      if (g[i][p] !== h[i][p]) fails.push({ kind: 'equivalence', cell: cell.id, prop: p, gen: g[i][p], hand: h[i][p] });
      // ORACLE · generated computed === restated design value
      checks++;
      if (g[i][p] !== cell.oracle[p]) fails.push({ kind: 'oracle', cell: cell.id, prop: p, gen: g[i][p], expected: cell.oracle[p] });
    }
  });

  const ok = fails.length === 0;
  const result = { ok, cells: CELLS.length, checks, failCount: fails.length, fails };

  const sum = document.getElementById('summary');
  sum.textContent = ok
    ? `PASS · ${CELLS.length} cells · ${checks} computed-style checks · generated ≡ hand AND generated ≡ oracle (incl. the muted-dark scope + the ★ display-order cells)`
    : `FAIL · ${fails.length}/${checks} checks failed`;
  sum.className = ok ? 'ok' : 'bad';

  const rows = [['cell', 'channel', 'generated', 'hand', 'oracle', '✓'].map((x) => `<th>${x}</th>`).join('')];
  CELLS.forEach((cell, i) => {
    Object.keys(cell.oracle).forEach((p) => {
      const gv = g[i][p], hv = h[i][p], ev = cell.oracle[p];
      const good = gv === hv && gv === ev;
      const swatch = p === 'color' ? `<span class="sw" style="background:${gv}"></span> ` : '';
      rows.push(
        `<tr><td>${cell.anchor ? '★ ' : ''}${cell.id}</td><td>${p}</td>` +
        `<td>${swatch}${gv}</td><td>${hv}</td><td>${ev}</td>` +
        `<td class="${good ? 'ok' : 'bad'}">${good ? '✓' : '✗'}</td></tr>`,
      );
    });
  });
  document.getElementById('report').innerHTML = `<table>${rows.join('')}</table>`;
  return result;
}

window.__parityReady = run().then((r) => (window.__parity = r)).catch((e) => {
  window.__parity = { ok: false, error: String((e && e.stack) || e) };
  document.getElementById('summary').textContent = 'ERROR · ' + window.__parity.error;
  document.getElementById('summary').className = 'bad';
  return window.__parity;
});
</script>
</body>
</html>
