<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuri · L3b·2 · interactive namespace CSS computed-style parity (gen vs hand · the order cell)</title>
<!--
  THE COMPUTED-STYLE CONFIRMATION (the L3b·2 reversible shadow · decision 70 / 67 / 73).

  Companion to the node harness (pipeline/interactive-css.test.js). That proves
  STRUCTURAL ≡ (same selectors, same declarations) AND — the centerpiece — the
  ORDER-SOUNDNESS of the equal-specificity `transform` pair (pressScale before
  disabledGuard, asserted structurally + against the hand oracle). This page is the
  REAL-ENGINE gold-standard confirmation: a live browser resolving the pseudo-state
  cascade the node parser cannot.

  TWO PASSES:
   · NATIVE (the real un-rewritten CSS) — the effects a browser resolves WITHOUT a
     synthesised pointer/keyboard state: affordance (cursor), and disabledOpacity via
     a real `<button disabled>` (:disabled) + a `[aria-disabled="true"]` node. These
     exercise the EXACT generated bytes.
   · PROXY (a documented, faithful rewrite) — getComputedStyle cannot synthesise
     :active / :focus-visible (no JS can hold :active). So for those, BOTH the generated
     and the hand CSS are rewritten by the SAME pure substitution `:active →
     [data-x-active]`, `:focus-visible → [data-x-focus]`, and the probe carries the
     matching attribute. WHY THIS IS FAITHFUL for the order claim: the substitution is
     (1) identical on gen and hand, (2) SPECIFICITY-PRESERVING — a pseudo-class and an
     attribute selector both contribute equally to specificity, so the pressScale vs
     disabledGuard rules stay EQUAL specificity (0,3,0), and (3) source-order-preserving
     (pure in-place text edit). Therefore the cascade resolution of `transform` for a
     node matching BOTH is IDENTICAL to the real :active case. The proxy measures the
     real engine's order resolution; it does not fabricate it.

  THE anchor (cell ★): a node with data-press-scale + aria-disabled="true", in the
  :active-proxy, resolves `transform` to `none` — the disabledGuard (emitted LATER, at
  equal specificity) wins by SOURCE ORDER, so a disabled control never scales. The
  contrast cell (press-scale, NOT disabled) resolves to matrix(0.97,…) — proving the
  scale DOES apply and that `none` is genuinely the disabled-guard overriding it.

  Oracle (the restated design constants · not read from the CSS under test):
    press-scale 0.97   → transform: matrix(0.97, 0, 0, 0.97, 0, 0)
    disabled-guard     → transform: none
    disabled-opacity   → opacity: 0.4
    focus-ring (light) → #ae91ff = rgb(174, 145, 255)   [lilac-8-light · no dark ancestor]
    affordance         → cursor: pointer

  Served by the repo-root http-server (the preview tooling · nuri-docs :8766); paths
  are relative to this page. Run via the preview tooling, then read window.__parity.
  NOT a CI gate (the node CI has no browser) — the node harness is the gate (the order
  guard proves the same claim by CSS-cascade semantics); this is the gold-standard.
-->
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 15px; } #summary { font-size: 14px; font-weight: 700; padding: 8px 0; }
  .ok { color: #137333; } .bad { color: #c5221f; font-weight: 700; }
  table { border-collapse: collapse; margin-top: 8px; } td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: left; }
  .pass { color: #888; }
</style>
<style id="tokens"></style>
<style id="ut"></style>
</head>
<body>
<h1>Nuri · L3b·2 · interactive namespace CSS computed-style parity (generated vs hand · the order cell)</h1>
<div id="summary">running…</div>
<div id="stage" aria-hidden="true" style="position:absolute; visibility:hidden;"></div>
<div id="report"></div>

<script>
// Each cell: a pass ('native' | 'proxy'), the probe tag + attrs (class nuri-interactive
// is added automatically · `disabled` is a property), and the channels to read with
// their restated oracle rgb/value. The proxy cells carry data-x-active / data-x-focus
// (the faithful :active / :focus-visible substitute · see the header). The ★ anchor is
// the order-sensitive transform cell.
const CELLS = [
  // ── NATIVE pass · the real un-rewritten generated CSS ──
  { pass: 'native', id: 'affordance · cursor (the bare .nuri-interactive)', tag: 'div', attrs: {},
    oracle: { 'cursor': 'pointer' } },
  { pass: 'native', id: 'disabledOpacity · real :disabled <button>', tag: 'button', disabled: true, attrs: {},
    oracle: { 'opacity': '0.4' } },
  { pass: 'native', id: 'disabledOpacity · [aria-disabled="true"] (non-form node)', tag: 'div', attrs: { 'aria-disabled': 'true' },
    oracle: { 'opacity': '0.4' } },

  // ── PROXY pass · :active / :focus-visible via the specificity-preserving rewrite ──
  { pass: 'proxy', id: 'pressScale · [data-press-scale] :active → scale (NOT disabled)', tag: 'div',
    attrs: { 'data-press-scale': '', 'data-x-active': '' },
    oracle: { 'transform': 'matrix(0.97, 0, 0, 0.97, 0, 0)' } },
  { pass: 'proxy', anchor: true,
    id: '★ ORDER · [data-press-scale][aria-disabled] :active → none (disabledGuard wins by source order)', tag: 'div',
    attrs: { 'data-press-scale': '', 'aria-disabled': 'true', 'data-x-active': '' },
    oracle: { 'transform': 'none' } },
  { pass: 'proxy', id: 'focus · :focus-visible → brand ring (light scope)', tag: 'div',
    attrs: { 'data-x-focus': '' },
    oracle: { 'outline-color': 'rgb(174, 145, 255)', 'outline-width': '2px', 'outline-style': 'solid' } },
];

// the faithful proxy rewrite (see header): pseudo-state → attribute, identical on gen
// and hand, specificity- and order-preserving.
const proxy = (css) => css.replaceAll(':active', '[data-x-active]').replaceAll(':focus-visible', '[data-x-focus]');

function buildNodes() {
  const stage = document.getElementById('stage');
  stage.textContent = '';
  return CELLS.map((cell) => {
    const probe = document.createElement(cell.tag);
    probe.className = 'nuri-interactive';
    if (cell.disabled) probe.disabled = true;
    for (const [k, v] of Object.entries(cell.attrs)) probe.setAttribute(k, v);
    stage.appendChild(probe);
    return probe;
  });
}

function measure(nodes) {
  return CELLS.map((cell, i) => {
    const cs = getComputedStyle(nodes[i]);
    const out = {};
    for (const p of Object.keys(cell.oracle)) out[p] = cs.getPropertyValue(p).trim();
    return out;
  });
}

async function run() {
  const [tokP, tokS, genCss, handCss] = await Promise.all([
    fetch('../styles/tokens-primitive.css').then((r) => r.text()),
    fetch('../styles/tokens-semantic.css').then((r) => r.text()),
    fetch('../lib/components/interactive/interactive.css').then((r) => r.text()), // LIVE (was build/css-preview · decision 74)
    fetch('../lib/components/interactive/interactive.css').then((r) => r.text()),
  ]);
  document.getElementById('tokens').textContent = tokP + '\n' + tokS;
  const ut = document.getElementById('ut');
  const nodes = buildNodes();

  // set the stylesheet, then WAIT for the `.nuri-interactive` transition (transform /
  // background over var(--nuri-duration-fast) = 120ms) to SETTLE before reading — else
  // a just-changed transform is mid-interpolation (e.g. identity matrix(1,…) instead of
  // the target scale(0.97)). We assert the resolved TARGET value, not the animation
  // frame; the transition itself is real CSS we simply let finish (zero CSS mutation).
  const setAndMeasure = async (css) => {
    ut.textContent = css;
    await new Promise((r) => setTimeout(r, 250));
    return measure(nodes);
  };

  // Measure each pass under gen then hand. NATIVE cells read the raw CSS; PROXY cells
  // read the rewritten CSS. A cell is only valid in its own pass, so we keep the
  // per-pass measurements and stitch by cell.
  const gen = {}, hand = {};
  for (const variant of ['native', 'proxy']) {
    const g = await setAndMeasure(variant === 'native' ? genCss : proxy(genCss));
    const h = await setAndMeasure(variant === 'native' ? handCss : proxy(handCss));
    CELLS.forEach((cell, i) => { if (cell.pass === variant) { gen[i] = g[i]; hand[i] = h[i]; } });
  }
  await setAndMeasure(proxy(genCss)); // leave the generated proxy active for visual inspection

  const fails = [];
  let checks = 0;
  CELLS.forEach((cell, i) => {
    for (const p of Object.keys(cell.oracle)) {
      // EQUIVALENCE · generated computed === hand computed
      checks++;
      if (gen[i][p] !== hand[i][p]) fails.push({ kind: 'equivalence', cell: cell.id, prop: p, gen: gen[i][p], hand: hand[i][p] });
      // ORACLE · generated computed === restated design value
      checks++;
      if (gen[i][p] !== cell.oracle[p]) fails.push({ kind: 'oracle', cell: cell.id, prop: p, gen: gen[i][p], expected: cell.oracle[p] });
    }
  });

  const ok = fails.length === 0;
  const result = { ok, cells: CELLS.length, checks, failCount: fails.length, fails };

  const sum = document.getElementById('summary');
  sum.textContent = ok
    ? `PASS · ${CELLS.length} cells · ${checks} computed-style checks · generated ≡ hand AND generated ≡ oracle (incl. the ★ order cell: transform → none)`
    : `FAIL · ${fails.length}/${checks} checks failed`;
  sum.className = ok ? 'ok' : 'bad';

  const rows = [['pass', 'cell', 'channel', 'generated', 'hand', 'oracle', '✓'].map((x) => `<th>${x}</th>`).join('')];
  CELLS.forEach((cell, i) => {
    Object.keys(cell.oracle).forEach((p) => {
      const gv = gen[i][p], hv = hand[i][p], ev = cell.oracle[p];
      const good = gv === hv && gv === ev;
      rows.push(
        `<tr><td class="pass">${cell.pass}</td><td>${cell.id}</td><td>${p}</td>` +
        `<td>${gv}</td><td>${hv}</td><td>${ev}</td>` +
        `<td class="${good ? 'ok' : 'bad'}">${good ? '✓' : '✗'}</td></tr>`,
      );
    });
  });
  document.getElementById('report').innerHTML = `<table>${rows.join('')}</table>`;
  return result;
}

window.__parityReady = run().then((r) => (window.__parity = r)).catch((e) => {
  window.__parity = { ok: false, error: String((e && e.stack) || e) };
  document.getElementById('summary').textContent = 'ERROR · ' + window.__parity.error;
  document.getElementById('summary').className = 'bad';
  return window.__parity;
});
</script>
</body>
</html>
