# ──────────────────────────────────────────────────────────────
# NURI · @nuri/doc · Jekyll / just-the-docs config (N+22 · re-homed N+42 · A4)
#
# The generated docs site (north-star move 3 · the generation thesis). The
# component pages under generated/components/ are BUILD OUTPUT — emitted by
# `npm run build -w @nuri/doc` (pipeline/build.js · re-sourced onto @nuri/spec's
# DATA), committed, and built IN PLACE by Jekyll (no longer staged). stage.mjs
# stages only the RUNTIME assets (@nuri/prototype + @nuri/spec token CSS →
# assets/nuri/) so the <nuri-demo> stories hydrate. The stories are authored
# partials under _includes/demo/ (a consumer story · decision 57.2 · NOT generated).
#
# Nav = consumer reference first: Components is the only visible parent section.
# Generated foundation and axis pages are top-level pages with explicit nav_order
# values emitted by doc-gen, so there is no extra parent-page click.
# ──────────────────────────────────────────────────────────────

title: Nuri
description: Nuri Design System · generated component documentation

# just-the-docs as a remote theme (north-star move 3). Pulled at build time;
# its runtime plugins are declared below (remote_theme fetches theme FILES, not
# the theme gem's dependencies — they must be in the Gemfile + plugins list).
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

color_scheme: light

aux_links:
  Nuri on GitHub:
    - https://github.com/nuri-com/nuri-design-system

# The playground is a standalone static app staged into the site (stage.mjs →
# assets/playground/). Link the full page directly from the main nav rather than
# wrapping it in a doc layout. NOTE: just-the-docs prepends the site baseurl to
# nav_external_links URLs, so this is a bare root-relative path (baseurl-portable).
nav_external_links:
  - title: Playground
    url: /assets/playground/pages/index.html
    hide_icon: false

# Nest the GENERATED component pages under Components WITHOUT editing them. Axis and
# foundation pages intentionally have no parent: Just the Docs hides child pages when
# their parent has `nav_exclude: true`, so top-level generated pages are the release
# IA path.
defaults:
  - scope:
      path: "generated/components"
    values:
      parent: Components

# Keep Jekyll from emitting non-page files + the frozen / source / staged-source
# trees as pages. (assets/nuri/** is the STAGED runtime static output — SERVED,
# not excluded. generated/** IS built — the doc pages. archive/** are the FROZEN
# hand pages — the A4b/A4c regen spec, NOT in the nav/build. harness/ + pipeline/
# are source — staged elsewhere / build-only.)
exclude:
  - stage.mjs
  - Gemfile
  - Gemfile.lock
  - package.json
  - README.md
  - archive
  - harness
  - pipeline
  - vendor
  - __preview__.html # the local hydration-proof page (gitignored · never a real page)
