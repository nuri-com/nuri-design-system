---
layout: default
nav_enabled: false
---

<style>
  .main-content,
  .main-content-wrap {
    max-width: none;
    padding: 0;
  }
  .main-content {
    margin: 0;
  }
  .page-content {
    padding: 0;
  }
  .nuri-playground-page {
    min-height: 100vh;
    background: var(--nuri-bg-canvas, #ffffff);
  }
  .nuri-playground-page__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--nuri-border-subtle, #d9d9d9);
  }
  .nuri-playground-page__title {
    margin: 0;
    font-size: 20px;
    line-height: 1.2;
  }
  .nuri-playground-page__link {
    white-space: nowrap;
  }
  .nuri-playground-page .nuri-playground-embed {
    height: calc(100vh - 65px);
    min-height: 560px;
    border: 0;
    border-radius: 0;
  }
  @media (max-width: 720px) {
    .nuri-playground-page__header {
      align-items: flex-start;
      flex-direction: column;
      padding: 14px 16px;
    }
    .nuri-playground-page .nuri-playground-embed {
      height: calc(100vh - 99px);
    }
  }
</style>

<div class="nuri-playground-page">
  {{ content }}
</div>
