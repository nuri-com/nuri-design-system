<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="/prototype/generated/styles/tokens-primitive.css"/>
<link rel="stylesheet" href="/prototype/generated/styles/tokens-semantic.css"/>
<link rel="stylesheet" href="/prototype/generated/styles/typography.css"/>
<link rel="stylesheet" href="/prototype/styles/palette.css"/>
<link rel="stylesheet" href="/prototype/styles/typography.css"/>
<link rel="stylesheet" href="/gen-ui.css"/>
<title>nuri gen-ui demo</title>
</head>
<body class="nuri-root">
  <main class="nuri-app">
    <h1 class="nuri-headline" data-type-style="xl">nuri gen-ui</h1>
    <form id="prompt" style="display:flex;gap:12px">
      <input class="nuri-input" id="prompt-input" type="text" placeholder="What do you want to do?" autocomplete="off" style="flex:1"/>
      <button class="nuri-btn nuri-btn-primary" type="submit">Send</button>
    </form>
    <div id="actions" style="display:flex;flex-direction:column;gap:12px"></div>
    <div id="history" style="display:flex;flex-direction:column;gap:24px"></div>
  </main>
  <script type="module" src="/demo/demo.js"></script>
</body>
</html>
