<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuri · L3b·1 · palette namespace CSS computed-style parity (gen vs hand · the dec-63 anchor)</title>
<!--
  THE COMPUTED-STYLE CONFIRMATION (the L3b·1 reversible shadow · decision 70 / 67).

  Companion to the node harness (pipeline/palette-css.test.js). That proves
  STRUCTURAL ≡ (same selectors, same declarations) — which for palette mathematically
  implies computed-style equivalence (background/color are DIRECT properties · no
  logical→physical, no shorthand/longhand overlap). So this page is NOT needed to
  prove the projection; its UNIQUE job is the SCOPE-dependent resolution the node
  parser cannot model: the generated palette projection, placed under real
  [data-theme]/[data-accent] DOM ancestry, must resolve to the right colours — the
  decision-63 #4b/#6b self-scope (N+32) especially (an element that self-scopes
  data-accent while a dark theme lives on an ANCESTOR). Only a real engine resolves
  that, and the palette CSS only references var(--nuri-accent-*) + rides that scope.

  It loads the live token CSS (styles/tokens-{primitive,semantic}.css) + BOTH the
  live generated palette CSS (packages/prototype/styles/palette.css), builds nested DOM scopes, and reads
  getComputedStyle of `.nuri-palette[data-*]` probes.

  Two assertions per (cell, channel):
    · EQUIVALENCE — generated computed === hand computed (the parity claim · under
                    real ancestry, where the cascade actually resolves).
    · ORACLE      — generated computed === the restated design rgb (cream + lilac ·
                    the colour-semantic.test.js validated values · so "gen ≡ hand"
                    AND "gen is correct").

  THE anchor (cell 8): a `.nuri-palette[data-variant=solid][data-accent=neutral]`
  under a [data-theme=dark] ANCESTOR resolves its background to cream-1-light
  rgb(255, 253, 242) — the swap CTA paints CREAM on the dark canvas (NOT
  dark-on-dark), via the #4b self-scope. The palette projection inherits N+32.

  Oracle rgb (cream + lilac · the independent design values):
    cream-1-light  #fffdf2 = rgb(255, 253, 242)   cream-1-dark #12110b = rgb(18, 17, 11)
    cream-12-light #222013 = rgb(34, 32, 19)       on-solid L   #f0eee3 = rgb(240, 238, 227)
    bg-strong L    #f3f1e2 = rgb(243, 241, 226)    border-strong#bfbcac = rgb(191, 188, 172)
    lilac-9        #beaaff = rgb(190, 170, 255)    lilac-on-solid#381b6a= rgb(56, 27, 106)
    text-muted L   #666455 = rgb(102, 100, 85)     border-subtle#dddac9 = rgb(221, 218, 201)
    transparent            = rgba(0, 0, 0, 0)

  Served by the repo-root http-server (the preview tooling); paths are relative to
  this page. Run via the preview tooling, then read window.__parity. NOT a CI gate
  (the node CI has no browser) — the node harness is the gate; this is the
  session-time gold-standard confirmation.
-->
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 15px; } #summary { font-size: 14px; font-weight: 700; padding: 8px 0; }
  .ok { color: #137333; } .bad { color: #c5221f; font-weight: 700; }
  table { border-collapse: collapse; margin-top: 8px; } td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: left; }
  .sw { display: inline-block; width: 18px; height: 18px; border: 1px solid #888; vertical-align: middle; }
  /* the two toggleable palette stylesheets + the always-on tokens are injected at runtime */
</style>
<style id="tokens"></style>
<style id="gen"></style>
<style id="hand"></style>
</head>
<body>
<h1>Nuri · L3b·1 · palette namespace CSS computed-style parity (generated vs hand · the dec-63 anchor)</h1>
<div id="summary">running…</div>
<div id="stage" aria-hidden="true" style="position:absolute; visibility:hidden;"></div>
<div id="report"></div>

<script>
// Each cell: nested ancestor scopes (outer→inner) + the probe's own attrs (class
// nuri-palette is added automatically) + the channels to read with their restated
// oracle rgb (null ⇒ equivalence-only). Spans every rest role + the scope variation
// (default · dark theme · lilac accent) the browser uniquely proves, anchored by the
// decision-63 self-scope (cell 8). Pressed (:active) is NOT here — it needs a real
// pointer press getComputedStyle cannot synthesize; the node Guard A proves it.
const CELLS = [
  { id: 'solid · default (neutral/light)', ancestors: [], el: { 'data-variant': 'solid' },
    oracle: { 'background-color': 'rgb(18, 17, 11)', 'color': 'rgb(240, 238, 227)' } },
  { id: 'soft · default', ancestors: [], el: { 'data-variant': 'soft' },
    oracle: { 'background-color': 'rgb(243, 241, 226)', 'color': 'rgb(34, 32, 19)' } },
  { id: 'ghost · default (explicit transparent bg)', ancestors: [], el: { 'data-variant': 'ghost' },
    oracle: { 'background-color': 'rgba(0, 0, 0, 0)', 'color': 'rgb(34, 32, 19)' } },
  { id: 'subtle · default (fg-only · no bg channel)', ancestors: [], el: { 'data-variant': 'subtle' },
    oracle: { 'background-color': 'rgba(0, 0, 0, 0)', 'color': 'rgb(191, 188, 172)' } },
  // outline · the first BORDER channel — the `border` SHORTHAND the node parser's
  // "no shorthand/longhand overlap" premise excluded; the browser's longhand
  // expansion (width+style+colour) is what this cell uniquely proves.
  { id: 'outline · default (border shorthand → longhand expansion)', ancestors: [], el: { 'data-variant': 'outline' },
    oracle: { 'background-color': 'rgba(0, 0, 0, 0)', 'color': 'rgb(102, 100, 85)',
              'border-top-width': '1px', 'border-top-style': 'solid', 'border-top-color': 'rgb(221, 218, 201)' } },
  { id: 'chrome=canvas · default', ancestors: [], el: { 'data-chrome': 'canvas' },
    oracle: { 'background-color': 'rgb(255, 253, 242)', 'color': 'rgb(34, 32, 19)' } },
  { id: 'chrome=strong · default', ancestors: [], el: { 'data-chrome': 'strong' },
    oracle: { 'background-color': 'rgb(243, 241, 226)', 'color': 'rgb(34, 32, 19)' } },
  { id: 'solid · under [data-theme=dark] ancestor (no accent on node · INVERSE flips)',
    ancestors: [{ 'data-theme': 'dark' }], el: { 'data-variant': 'solid' },
    oracle: { 'background-color': 'rgb(255, 253, 242)', 'color': 'rgb(34, 32, 19)' } },
  { id: 'THE dec-63 anchor · solid + neutral SELF-SCOPE under [data-theme=dark] → cream-1-light',
    ancestors: [{ 'data-theme': 'dark' }], el: { 'data-variant': 'solid', 'data-accent': 'neutral' },
    oracle: { 'background-color': 'rgb(255, 253, 242)' }, anchor: true },
  { id: 'solid · under [data-accent=lilac] ancestor',
    ancestors: [{ 'data-accent': 'lilac' }], el: { 'data-variant': 'solid' },
    oracle: { 'background-color': 'rgb(190, 170, 255)', 'color': 'rgb(56, 27, 106)' } },
];

function buildNodes() {
  const stage = document.getElementById('stage');
  stage.textContent = '';
  return CELLS.map((cell) => {
    let mount = stage;
    for (const attrs of cell.ancestors) {
      const wrap = document.createElement('div');
      for (const [k, v] of Object.entries(attrs)) wrap.setAttribute(k, v);
      mount.appendChild(wrap);
      mount = wrap;
    }
    const probe = document.createElement('div');
    probe.className = 'nuri-palette';
    for (const [k, v] of Object.entries(cell.el)) probe.setAttribute(k, v);
    mount.appendChild(probe);
    return probe;
  });
}

function measure(nodes) {
  return CELLS.map((cell, i) => {
    const cs = getComputedStyle(nodes[i]);
    const out = {};
    for (const p of Object.keys(cell.oracle)) out[p] = cs.getPropertyValue(p).trim();
    return out;
  });
}

async function run() {
  const files = await Promise.all([
    // the token CSS is the prototype projection's OWN generated output (N+62 ·
    // decision 80 · was ../../spec/styles/ before the spec went pure-data)
    fetch('../generated/styles/tokens-primitive.css').then((r) => r.text()),
    fetch('../generated/styles/tokens-semantic.css').then((r) => r.text()),
    fetch('../styles/palette.css').then((r) => r.text()), // LIVE (was build/css-preview · decision 74)
    fetch('../styles/palette.css').then((r) => r.text()),
  ]);
  const [tokP, tokS, genPalette, handPalette] = files;
  document.getElementById('tokens').textContent = tokP + '\n' + tokS;
  const styleGen = document.getElementById('gen');
  const styleHand = document.getElementById('hand');
  styleGen.textContent = genPalette;
  styleHand.textContent = handPalette;

  const nodes = buildNodes();

  styleGen.disabled = false; styleHand.disabled = true;
  const g = measure(nodes);
  styleGen.disabled = true; styleHand.disabled = false;
  const h = measure(nodes);
  styleGen.disabled = false; // leave generated active for visual inspection

  const fails = [];
  let checks = 0;
  CELLS.forEach((cell, i) => {
    for (const p of Object.keys(cell.oracle)) {
      // EQUIVALENCE · generated computed === hand computed
      checks++;
      if (g[i][p] !== h[i][p]) fails.push({ kind: 'equivalence', cell: cell.id, prop: p, gen: g[i][p], hand: h[i][p] });
      // ORACLE · generated computed === restated design rgb (where given)
      const expected = cell.oracle[p];
      if (expected !== null) {
        checks++;
        if (g[i][p] !== expected) fails.push({ kind: 'oracle', cell: cell.id, prop: p, gen: g[i][p], expected });
      }
    }
  });

  const ok = fails.length === 0;
  const result = { ok, cells: CELLS.length, checks, failCount: fails.length, fails };

  const sum = document.getElementById('summary');
  sum.textContent = ok
    ? `PASS · ${CELLS.length} cells · ${checks} computed-style checks · generated ≡ hand AND generated ≡ oracle (incl. the dec-63 self-scope anchor)`
    : `FAIL · ${fails.length}/${checks} checks failed`;
  sum.className = ok ? 'ok' : 'bad';

  const rows = [['cell', 'channel', 'generated', 'hand', 'oracle', '✓'].map((x) => `<th>${x}</th>`).join('')];
  CELLS.forEach((cell, i) => {
    Object.keys(cell.oracle).forEach((p) => {
      const gv = g[i][p], hv = h[i][p], ev = cell.oracle[p] === null ? '—' : cell.oracle[p];
      const good = gv === hv && (ev === '—' || gv === ev);
      rows.push(
        `<tr><td>${cell.anchor ? '★ ' : ''}${cell.id}</td><td>${p}</td>` +
        `<td><span class="sw" style="background:${gv}"></span> ${gv}</td><td>${hv}</td><td>${ev}</td>` +
        `<td class="${good ? 'ok' : 'bad'}">${good ? '✓' : '✗'}</td></tr>`,
      );
    });
  });
  document.getElementById('report').innerHTML = `<table>${rows.join('')}</table>`;
  return result;
}

window.__parityReady = run().then((r) => (window.__parity = r)).catch((e) => {
  window.__parity = { ok: false, error: String((e && e.stack) || e) };
  document.getElementById('summary').textContent = 'ERROR · ' + window.__parity.error;
  document.getElementById('summary').className = 'bad';
  return window.__parity;
});
</script>
</body>
</html>
