<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuri · L3c · namespace CSS computed-style oracle (live · decision 74)</title>
<!--
  THE COMPUTED-STYLE SPOT-CHECK (the L3.1 reversible spike · decision 70).

  The companion to the node harness (pipeline/css-preview.test.js). That proves
  STRUCTURAL ≡ (same selectors, same declarations) — which mathematically implies
  computed-style equivalence. This page is the INDEPENDENT browser oracle: it
  loads the LIVE generated namespace CSS (packages/prototype/styles/{box,stack}.css · GENERATED by
  `npm run build` · decision 74 · the L3c flip · the equivalence leg is now self-comparison ·
  vestigial · the ORACLE leg is the live check), applies it to sample nodes, and compares
  getComputedStyle — the only check that exercises the real engine's
  logical→physical resolution (inline-size→width · padding-inline→left/right …)
  that the node harness cannot.

  Two assertions per curated cell:
    · EQUIVALENCE — generated computed === hand computed (the parity claim).
    · ORACLE      — generated computed === the expected px / keyword (the design
                    scale · so "generated ≡ hand" AND "generated is correct").

  Served by the repo-root http-server (preview "nuri-docs" · :8766); paths are
  relative to this page. Run via the preview tooling, then read window.__parity.
  NOT a CI gate (the node CI has no browser) — the node harness is the gate; this
  is the session-time gold-standard confirmation.
-->
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 15px; } #summary { font-size: 14px; font-weight: 700; padding: 8px 0; }
  table { border-collapse: collapse; margin-top: 8px; } td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: left; }
  .ok { color: #137333; } .bad { color: #c5221f; font-weight: 700; }
  /* the two toggleable stylesheets + the always-on tokens are injected at runtime */
</style>
<style id="tokens"></style>
<style id="gen"></style>
<style id="hand"></style>
</head>
<body>
<h1>Nuri · L3.1 · namespace CSS computed-style parity (generated vs hand)</h1>
<div id="summary">running…</div>
<div id="stage" aria-hidden="true" style="position:absolute; visibility:hidden;"></div>
<div id="report"></div>

<script>
// [ns, data-attr, value, [computed props to read], {prop: expected} | null]
// Spans every Field arm + the logical-prop remap. Expected px are the design
// scale (space xs4 sm6 md12 lg18 xl24 · size xs18 sm24 md36 lg48 xl60 2xl72
// 3xl90 · radius sm6 md12 lg18 full9999) — the independent oracle.
const CELLS = [
  ['box', 'data-width', 'md', ['width'], { width: '36px' }],                                  // scale·size → inline-size→width
  ['box', 'data-height', 'lg', ['height'], { height: '48px' }],
  ['box', 'data-min-height', '3xl', ['min-height'], { 'min-height': '90px' }],                // full 7-leaf · min-block-size→min-height
  ['box', 'data-padding', 'lg', ['padding-top', 'padding-right', 'padding-bottom', 'padding-left'],
    { 'padding-top': '18px', 'padding-right': '18px', 'padding-bottom': '18px', 'padding-left': '18px' }],
  ['box', 'data-padding-x', 'xl', ['padding-left', 'padding-right'], { 'padding-left': '24px', 'padding-right': '24px' }], // padding-inline
  ['box', 'data-padding-y', 'sm', ['padding-top', 'padding-bottom'], { 'padding-top': '6px', 'padding-bottom': '6px' }],   // padding-block
  ['box', 'data-padding-start', 'md', ['padding-left'], { 'padding-left': '12px' }],          // LTR: inline-start→left
  ['box', 'data-padding-end', 'sm', ['padding-right'], { 'padding-right': '6px' }],           // LTR: inline-end→right
  ['box', 'data-padding-top', 'xs', ['padding-top'], { 'padding-top': '4px' }],               // block-start→top
  ['box', 'data-padding-bottom', 'lg', ['padding-bottom'], { 'padding-bottom': '18px' }],     // block-end→bottom
  ['box', 'data-radius', 'full', ['border-top-left-radius'], { 'border-top-left-radius': '9999px' }],
  ['box', 'data-radius', 'sm', ['border-top-left-radius'], { 'border-top-left-radius': '6px' }],
  ['box', 'data-center', 'true', ['margin-left', 'margin-right'], { 'margin-left': '80px', 'margin-right': '80px' }], // margin-inline:auto · 40px box in 200px parent → 80px each
  ['stack', 'data-gap', 'md', ['column-gap', 'row-gap'], { 'column-gap': '12px', 'row-gap': '12px' }],
  ['stack', 'data-direction', 'row', ['flex-direction'], { 'flex-direction': 'row' }],        // literal
  ['stack', 'data-align', 'center', ['align-items'], { 'align-items': 'center' }],            // keyword
  ['stack', 'data-justify', 'between', ['justify-content'], { 'justify-content': 'space-between' }], // keyword (renamed)
  ['stack', 'data-wrap', 'true', ['flex-wrap'], { 'flex-wrap': 'wrap' }],                     // flag
  ['stack', 'data-fill', 'grow', ['flex-grow', 'flex-shrink', 'flex-basis'], { 'flex-grow': '1', 'flex-shrink': '0', 'flex-basis': 'auto' }], // expand
  ['stack', 'data-fill', 'grow-shrink', ['flex-grow', 'flex-shrink', 'min-width'], { 'flex-grow': '1', 'flex-shrink': '1', 'min-width': '0px' }], // expand·min-inline-size→min-width
];

function buildNodes() {
  const stage = document.getElementById('stage');
  stage.textContent = '';
  return CELLS.map(([ns, attr, value]) => {
    let node = document.createElement('div');
    node.className = 'nuri-' + ns;
    node.setAttribute(attr, value);
    if (attr === 'data-center') {
      // margin-inline:auto needs a bounded width + a wider parent to resolve to a
      // real used value — wrap in a 200px parent, give the box a 40px inline width.
      node.setAttribute('data-width', 'xs'); // 18px is fine, but use explicit style for determinism
      node.style.width = '40px';
      const parent = document.createElement('div');
      parent.style.width = '200px';
      parent.appendChild(node);
      stage.appendChild(parent);
    } else {
      stage.appendChild(node);
    }
    return node;
  });
}

function measure(nodes) {
  return CELLS.map(([, , , props], i) => {
    const cs = getComputedStyle(nodes[i]);
    const out = {};
    for (const p of props) out[p] = cs.getPropertyValue(p).trim();
    return out;
  });
}

async function run() {
  const files = await Promise.all([
    fetch('../../spec/styles/tokens-primitive.css').then((r) => r.text()),
    fetch('../../spec/styles/tokens-semantic.css').then((r) => r.text()),
    fetch('../styles/box.css').then((r) => r.text()),
    fetch('../styles/stack.css').then((r) => r.text()),
    fetch('../styles/box.css').then((r) => r.text()),
    fetch('../styles/stack.css').then((r) => r.text()),
  ]);
  const [tokP, tokS, genBox, genStack, handBox, handStack] = files;
  document.getElementById('tokens').textContent = tokP + '\n' + tokS;
  const styleGen = document.getElementById('gen');
  const styleHand = document.getElementById('hand');
  styleGen.textContent = genBox + '\n' + genStack;
  styleHand.textContent = handBox + '\n' + handStack;

  const nodes = buildNodes();

  styleGen.disabled = false; styleHand.disabled = true;
  const g = measure(nodes);
  styleGen.disabled = true; styleHand.disabled = false;
  const h = measure(nodes);
  styleGen.disabled = false; // leave generated active for visual inspection

  const fails = [];
  let checks = 0;
  CELLS.forEach(([ns, attr, value, props, expected], i) => {
    const cell = `${ns}[${attr}="${value}"]`;
    for (const p of props) {
      // EQUIVALENCE · generated computed === hand computed
      checks++;
      if (g[i][p] !== h[i][p]) fails.push({ kind: 'equivalence', cell, prop: p, gen: g[i][p], hand: h[i][p] });
      // ORACLE · generated computed === expected (where an oracle is given)
      if (expected && expected[p] !== undefined) {
        checks++;
        if (g[i][p] !== expected[p]) fails.push({ kind: 'oracle', cell, prop: p, gen: g[i][p], expected: expected[p] });
      }
    }
  });

  const ok = fails.length === 0;
  const result = { ok, cells: CELLS.length, checks, failCount: fails.length, fails };

  // render
  const sum = document.getElementById('summary');
  sum.textContent = ok
    ? `PASS · ${CELLS.length} cells · ${checks} computed-style checks · generated ≡ hand AND generated ≡ oracle`
    : `FAIL · ${fails.length}/${checks} checks failed`;
  sum.className = ok ? 'ok' : 'bad';

  const rows = [['cell', 'prop', 'generated', 'hand', 'oracle', '✓'].map((h) => `<th>${h}</th>`).join('')];
  CELLS.forEach(([ns, attr, value, props, expected], i) => {
    const cell = `${ns}[${attr}="${value}"]`;
    props.forEach((p) => {
      const gv = g[i][p], hv = h[i][p], ev = expected && expected[p] !== undefined ? expected[p] : '—';
      const good = gv === hv && (ev === '—' || gv === ev);
      rows.push(`<tr><td>${cell}</td><td>${p}</td><td>${gv}</td><td>${hv}</td><td>${ev}</td>` +
        `<td class="${good ? 'ok' : 'bad'}">${good ? '✓' : '✗'}</td></tr>`);
    });
  });
  document.getElementById('report').innerHTML = `<table>${rows.join('')}</table>`;
  return result;
}

window.__parityReady = run().then((r) => (window.__parity = r)).catch((e) => {
  window.__parity = { ok: false, error: String(e && e.stack || e) };
  document.getElementById('summary').textContent = 'ERROR · ' + window.__parity.error;
  document.getElementById('summary').className = 'bad';
  return window.__parity;
});
</script>
</body>
</html>
