# ──────────────────────────────────────────────────────────────
# NURI · WEBSITE · Jekyll / just-the-docs config (N+22 · decision 66 arc #1)
#
# The generated docs site (north-star move 3 · the generation thesis). The
# component pages under components/ are BUILD OUTPUT — staged from
# packages/spec/build/docs/*.md by stage.mjs, run before `jekyll build` (the
# workflow + local both run it). The <nuri-demo> STORIES are authored partials
# under _includes/demo/ (a consumer story · decision 57.2 · NOT generated).
#
# This is its OWN workspace-dir; the legacy spec pages under
# packages/spec/pages/ keep their .nojekyll zero-build posture, untouched —
# website opts into Jekyll in isolation (north-star move 3).
# ──────────────────────────────────────────────────────────────

title: Nuri
description: Nuri Design System · generated component documentation

# just-the-docs as a remote theme (north-star move 3). Pulled at build time;
# its runtime plugins are declared below (remote_theme fetches theme FILES, not
# the theme gem's dependencies — they must be in the Gemfile + plugins list).
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

color_scheme: light

aux_links:
  Nuri on GitHub:
    - https://github.com/nuri-com/nuri-design-system

# Non-page files at the site root — keep Jekyll from emitting them as pages.
# (assets/nuri/** is staged static output; components/** are staged pages.)
exclude:
  - stage.mjs
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - __preview__.html # the local hydration-proof page (gitignored · never a real page)
