name: gates

# The same gates the working sessions run by hand, enforced on every PR
# (and on pushes to main). Authoritative pre-merge check.
#
# Monorepo (decision 65.7/65.8/65.9/65.10): the repo is an npm-workspaces
# monorepo. M3 reshapes the single `gates` job into THREE parallel
# per-workspace jobs — `spec` · `factory` · `expo-demo` — so the gate becomes
# INTRA-REPO: the `factory` render-smoke imports @nuri/spec's frozen
# descriptors+tokens and RENDERS them, so a contract change that breaks the RN
# render fails CI by construction (no cross-repo seam). This is the per-workspace
# CI the monorepo was built to make possible — it CLOSES R7 (decision 65.10).
#
# Required checks (operator · decision B · reconfigured ONCE at M3):
#   branch protection `gates` → `spec` + `factory` + `expo-demo` (the 3 job names).
#
# Install scoping (verified M3): `npm ci -w @nuri/<job>` does NOT scope — `npm ci`
# reconstructs the whole lockfile tree by design (`-w` only scopes the focus
# package's scripts), so the `spec` job's install still pulls the RN toolchain.
# Each job therefore runs full `npm ci`; 65.7's "RN out of the web gates"
# optimization is DEFERRED (decision 65.10). The zero-build ITERATION property
# (the browser resolves var() natively) is unaffected either way.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The web/pipeline radix · = the pre-M3 `gates` job, workspace-scoped to @nuri/spec.
  # button-matrix STAYS gating here (the migration tsc · retires at M4).
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked · workspace-aware)
        run: npm ci

      - name: Test (pipeline drift guards · @nuri/spec)
        run: npm test -w @nuri/spec

      - name: Build the RN emit (@nuri/spec)
        run: npm run build -w @nuri/spec

      - name: packages/spec/build/ must match source (no stale committed emit)
        # build/ is committed (decision 35). If a source change wasn't
        # rebuilt, the fresh emit diverges from the committed files — fail
        # so the author runs `npm run build -w @nuri/spec` and commits it.
        run: git diff --exit-code packages/spec/build/

      - name: Typecheck the web↔RN migration mirror
        # button-matrix stays at docs/migration-tests/ (NOT a workspace);
        # it imports the emitted contract relative to packages/spec/build/.
        # Retires at M4 (the factory render-smoke below already gates the
        # contract intra-repo · decision 65.7/65.10).
        run: npx tsc -p docs/migration-tests/button-matrix/tsconfig.json

  # The bare certified RN engine. THIS JOB IS THE INTRA-REPO CONTRACT GATE (R7).
  # The render-smoke imports @nuri/spec's frozen descriptors+tokens through the
  # exports map and mounts the factory output with react-test-renderer — so a
  # packages/spec/build/* change that breaks the RN render fails HERE, in the
  # same repo, by construction. This is the failure mode R7 named (a contract
  # change merging green while breaking RN render) closed without a cross-repo
  # seam (decision 65.10).
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked · workspace-aware)
        run: npm ci

      - name: Render-smoke (@nuri/factory · GATES @nuri/spec/build intra-repo)
        # Imports the frozen contract from @nuri/spec and RENDERS it (jest-expo +
        # react-test-renderer · 7 snapshots). A spec/build change that breaks the
        # RN render fails this step — the gate the monorepo was built to make
        # intra-repo (R7 closed · decision 65.10).
        run: npm test -w @nuri/factory

      - name: Typecheck the @nuri/spec → @nuri/factory exports boundary
        # The factory consumes @nuri/spec through its exports map; a contract
        # TYPE break (a renamed/retyped descriptor subpath) fails here.
        run: npm run typecheck -w @nuri/factory

  # The consumable EXAMPLE app · must compile against @nuri/factory's ergonomic
  # components (the RN team's reference for how the spec is consumed).
  expo-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked · workspace-aware)
        run: npm ci

      - name: Typecheck the reference example (@nuri/expo-demo → @nuri/factory)
        run: npm run typecheck -w @nuri/expo-demo
