name: gates

# The same gates the working sessions run by hand, enforced on every PR
# (and on pushes to main). Authoritative pre-merge check.
#
# Monorepo (decision 65.7/65.8/65.9/65.10): the repo is an npm-workspaces
# monorepo. M3 reshapes the single `gates` job into parallel per-workspace jobs —
# `spec` · `rn` · `expo-demo` — so the gate becomes INTRA-REPO: the `rn`
# render-smoke imports @nuri/spec's frozen descriptors+tokens and RENDERS them, so a
# contract change that breaks the RN render fails CI by construction (no cross-repo
# seam). This is the per-workspace CI the monorepo was built to make possible — it
# CLOSES R7 (decision 65.10). N+41 (the A3 carve) added a FOURTH job — `prototype` —
# the build-free web library: it regenerates the namespace CSS from @nuri/spec's SoTs
# and gates re-emit ≡ committed (prototype → spec). N+42 (the A4 carve) added a FIFTH
# job — `doc` — the SSG site: it transforms @nuri/spec's DATA exports → the generated
# component Markdown and gates re-emit ≡ committed (the moved Guard G · doc → prototype → spec).
#
# Required checks (operator · decision B · reconfigured at M3 · extended at N+41/N+42):
#   branch protection `gates` → `spec` + `prototype` + `rn` + `expo-demo` + `doc` (the 5
#   job names · the operator adds `prototype` + `doc` to required checks).
#
# Install scoping (verified M3): `npm ci -w @nuri/<job>` does NOT scope — `npm ci`
# reconstructs the whole lockfile tree by design (`-w` only scopes the focus
# package's scripts), so the `spec` job's install still pulls the RN toolchain.
# Each job therefore runs full `npm ci`; 65.7's "RN out of the web gates"
# optimization is DEFERRED (decision 65.10). The zero-build ITERATION property
# (the browser resolves var() natively) is unaffected either way.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The token-pipeline gate · runs the root scripts/ codegen + its drift guards and diffs
  # the GENERATED homes. The codegen moved out of spec at N+53; at N+62 (the infra exit ·
  # decision 80) the generated OUTPUT moved out too — the RN contract into
  # @nuri/rn/generated/, the web output into @nuri/prototype/generated/ — so @nuri/spec is
  # now pure DATA (tokens/ axes/ components/ icons/ · nothing generated to diff). KEEP the
  # `spec` name — it is a required check.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked · workspace-aware)
        run: npm ci

      - name: Test (token-pipeline drift guards · root scripts/)
        # The codegen + its 6 drift guards moved to the root scripts/ dir at N+53
        # (convergence phase 4·3 · @nuri/spec is now no-deps/no-scripts). This job
        # keeps the `spec` name (a required check) — only what it runs changed.
        run: node --test scripts/*.test.js

      - name: Build the token emit (root scripts/ → @nuri/rn/generated/ + @nuri/prototype/generated/)
        run: node scripts/tokens-parser.js

      - name: the generated homes must match source (no stale committed emit)
        # The RN contract (@nuri/rn/generated/) + the web output (@nuri/prototype/generated/)
        # are committed (decision 35 · re-emit ≡ committed · now per-projection · N+62); the
        # codegen regenerates both IN PLACE. If a SoT change wasn't rebuilt, the fresh emit
        # diverges from the committed files — fail so the author runs
        # `node scripts/tokens-parser.js` and commits it. (@nuri/spec is pure data — nothing
        # generated lives there to diff; the prototype job diffs its own namespace styles/.)
        run: git diff --exit-code packages/rn/generated packages/prototype/generated

  # The build-free web LIBRARY · @nuri/prototype (the A3 carve · N+41). Owns the web
  # mechanism (factory · primitives · the 3 recipes · nuri-demo) AND the namespace-CSS
  # GENERATION: it reads @nuri/spec's TS SoTs + the generated tokens-semantic.css across
  # the package boundary (prototype → spec) and emits styles/<ns>.css. The build+diff is
  # the re-emit ≡ committed guard (the freshness the 4 namespace tests also assert in
  # memory). Self-sufficient against the committed tree — the `spec` job guards the token
  # CSS freshness prototype reads.
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked · workspace-aware)
        run: npm ci

      - name: Test (namespace-CSS freshness/value guards · @nuri/prototype)
        run: npm test -w @nuri/prototype

      - name: Build the namespace CSS (@nuri/prototype · reads @nuri/spec SoTs)
        run: npm run build -w @nuri/prototype

      - name: packages/prototype/styles/ must match source (re-emit ≡ committed)
        run: git diff --exit-code packages/prototype/styles/

  # The SSG documentation site · @nuri/doc (the A4 carve · N+42). Owns the doc-gen:
  # it transforms @nuri/spec's DATA exports (tokens · token-vars · palette · the
  # descriptor twins) → the generated component Markdown. The build+diff is the
  # re-emit ≡ committed guard (the byte-identity the moved Guard G also asserts in
  # memory · "spec emits data, doc transforms it" · convergence §5). doc → prototype → spec.
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked · workspace-aware)
        run: npm ci

      - name: Test (doc-gen drift guard · Guard G · @nuri/doc)
        run: npm test -w @nuri/doc

      - name: Build the docs (emits the generated Markdown · @nuri/doc)
        run: npm run build -w @nuri/doc

      - name: packages/doc/generated/ must match source (re-emit ≡ committed)
        run: git diff --exit-code packages/doc/generated/

  # The bare certified RN engine. THIS JOB IS THE INTRA-REPO CONTRACT GATE (R7).
  # The render-smoke imports @nuri/spec's frozen descriptors+tokens through the
  # exports map and mounts the factory output with react-test-renderer — so a
  # packages/spec/build/* change that breaks the RN render fails HERE, in the
  # same repo, by construction. This is the failure mode R7 named (a contract
  # change merging green while breaking RN render) closed without a cross-repo
  # seam (decision 65.10).
  rn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked · workspace-aware)
        run: npm ci

      - name: Render-smoke (@nuri/rn · GATES @nuri/spec/build intra-repo)
        # Imports the frozen contract from @nuri/spec and RENDERS it (jest-expo +
        # react-test-renderer · 7 snapshots). A spec/build change that breaks the
        # RN render fails this step — the gate the monorepo was built to make
        # intra-repo (R7 closed · decision 65.10).
        run: npm test -w @nuri/rn

      - name: Typecheck the @nuri/spec → @nuri/rn exports boundary
        # The factory consumes @nuri/spec through its exports map; a contract
        # TYPE break (a renamed/retyped descriptor subpath) fails here.
        run: npm run typecheck -w @nuri/rn

  # The consumable EXAMPLE app · must compile against @nuri/rn's ergonomic
  # components (the RN team's reference for how the spec is consumed).
  expo-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked · workspace-aware)
        run: npm ci

      - name: Typecheck the reference example (@nuri/expo-demo → @nuri/rn)
        run: npm run typecheck -w @nuri/expo-demo
